<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Up How You Use AI — Level Complete</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%;margin:0;overflow:hidden}body{display:grid;place-items:center;cursor:pointer;user-select:none}
.stage{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--stage-scale,1));transform-origin:center;overflow:hidden;background:var(--ground)}
.stage.is-jump *{transition:none!important;animation:none!important}
.floor{position:absolute;left:0;right:0;bottom:28px;height:3px;background:var(--ash);opacity:.5}
.complete-frame,.closing-frame{position:absolute;z-index:10;left:50%;top:82px;transform:translateX(-50%) translateY(-220px);box-sizing:border-box;background:var(--ground-light);border:5px solid var(--ink);box-shadow:inset 0 0 0 3px var(--ground-light),inset 0 0 0 5px var(--ash);text-align:center;opacity:0}
.complete-frame{width:610px;padding:28px 44px 30px}.complete-frame h1{margin:0;font:600 55px/1.08 var(--font-body);letter-spacing:.08em;color:var(--ink)}.complete-frame p{margin:10px 0 0;font:600 15px var(--font-mono);letter-spacing:.18em;color:var(--ink-soft)}
.stage[data-beat="1"] .complete-frame{opacity:1;transform:translateX(-50%)}.stage[data-beat="1"].is-forward .complete-frame{animation:frameDrop .72s cubic-bezier(.16,1,.3,1) .12s both}.stage[data-beat="2"] .complete-frame{opacity:1;transform:translateX(-50%) translateY(-38px) scale(.72)}
@keyframes frameDrop{from{opacity:0;transform:translate(-50%,-220px)}to{opacity:1;transform:translate(-50%,0)}}
.flag{position:absolute;z-index:4;left:1015px;bottom:28px;width:42px;height:178px;border-left:5px solid var(--ink);opacity:0;transform:translateY(22px);transition:opacity .35s,transform .55s cubic-bezier(.16,1,.3,1)}
.flag:before{content:"";position:absolute;left:0;top:0;width:55px;height:38px;border:4px solid var(--ink);background:conic-gradient(from 90deg,var(--ink) 25%,var(--ground-light) 0 50%,var(--ink) 0 75%,var(--ground-light) 0);background-size:16px 16px}.flag:after{content:"";position:absolute;left:-10px;bottom:-5px;width:24px;height:7px;background:var(--ink)}.stage[data-beat="1"] .flag{opacity:1;transform:none}
.stairs{position:absolute;inset:0;opacity:0;transition:opacity .45s}.stage[data-beat="2"] .stairs{opacity:1}.stage[data-beat="3"] .stairs{opacity:.28}
.step{position:absolute;bottom:28px;width:210px;box-sizing:border-box;padding:11px 10px 0;background:var(--ground-light);border:4px solid var(--ink);border-bottom:0;text-align:center;transform:translateY(34px);opacity:0;transition:opacity .35s ease-out,transform .48s cubic-bezier(.16,1,.3,1)}
.step:nth-child(1){left:220px;height:96px;transition-delay:.03s}.step:nth-child(2){left:430px;height:144px;transition-delay:.12s}.step:nth-child(3){left:640px;height:192px;transition-delay:.21s}.step:nth-child(4){left:850px;height:240px;transition-delay:.3s;border-top-width:8px;padding-top:7px}.stage[data-beat="2"] .step,.stage[data-beat="3"] .step{opacity:1;transform:none}
.step .no{font:600 15px var(--font-mono);letter-spacing:.18em;color:var(--ink-soft)}.step:last-child .no{color:var(--accent)}.step .name{margin-top:3px;font:600 18px/1.2 var(--font-body);color:var(--ink);text-transform:uppercase;white-space:nowrap}
.cast{position:absolute;z-index:5;inset:0;pointer-events:none}.actor{position:absolute;bottom:28px;transition:left .72s cubic-bezier(.16,1,.3,1),bottom .72s cubic-bezier(.16,1,.3,1),opacity .3s;opacity:0}.actor .sprite svg{display:block;height:120px;width:auto}.actor-human{left:-130px}.actor-robot{left:1290px}
.stage[data-beat="1"] .actor{opacity:1}.stage[data-beat="1"] .actor-human{left:650px}.stage[data-beat="1"] .actor-robot{left:770px}.stage[data-beat="1"].is-forward .actor-human{animation:walkToFinish 1.55s linear .18s both}.stage[data-beat="1"].is-forward .actor-robot{animation:floatToFinish 1.55s cubic-bezier(.3,.7,.4,1) .18s both}
@keyframes walkToFinish{from{left:-130px}to{left:650px}}@keyframes floatToFinish{from{left:1290px}to{left:770px}}
.stage[data-beat="2"] .actor,.stage[data-beat="3"] .actor{opacity:1}.stage[data-beat="2"] .actor-human,.stage[data-beat="3"] .actor-human{left:914px;bottom:268px}.stage[data-beat="2"] .actor-robot,.stage[data-beat="3"] .actor-robot{left:1065px;bottom:268px}.stage[data-beat="2"].is-forward .actor-human{animation:humanLevelUp .82s cubic-bezier(.34,.1,.3,1) both}.stage[data-beat="2"].is-forward .actor-robot{animation:robotLevelUp .82s cubic-bezier(.3,.7,.4,1) both}
@keyframes humanLevelUp{0%{left:650px;bottom:28px}45%{bottom:332px}100%{left:914px;bottom:268px}}@keyframes robotLevelUp{from{left:770px;bottom:28px}to{left:1065px;bottom:268px}}
.closing-frame{top:58px;width:820px;padding:24px 46px 26px}.closing-frame h1{margin:0;font:600 47px/1.08 var(--font-body);letter-spacing:.045em;text-transform:uppercase;color:var(--ink)}.closing-frame p{margin:13px 0 0;font:500 27px/1.25 var(--font-body);color:var(--ink)}
.stage[data-beat="3"] .complete-frame{opacity:0;transform:translateX(-50%) translateY(-58px) scale(.68)}.stage[data-beat="3"] .closing-frame{opacity:1;transform:translateX(-50%)}.stage[data-beat="3"].is-forward .closing-frame{animation:frameDrop .72s cubic-bezier(.16,1,.3,1) both}
.qna{position:absolute;z-index:12;left:50%;top:290px;transform:translateX(-50%) translateY(8px);font:600 22px var(--font-mono);letter-spacing:.25em;color:var(--ink);white-space:nowrap;opacity:0}.stage[data-beat="3"].is-waiting .qna{animation:qnaIn .35s ease-out both,qnaBlink 1.25s steps(1,end) .35s infinite}
@keyframes qnaIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}@keyframes qnaBlink{0%,55%{opacity:1}56%,100%{opacity:.18}}
.wait{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);font:600 17px var(--font-mono);opacity:0}.stage.is-waiting:not([data-beat="3"]) .wait{opacity:.65;animation:waitBlink 1.1s steps(1,end) infinite}@keyframes waitBlink{0%,45%{opacity:.65}46%,100%{opacity:.12}}
.controls{position:absolute;z-index:20;right:16px;bottom:8px;display:flex;align-items:center;gap:2px}.controls button{padding:7px 9px;border:0;background:none;color:var(--ink);font:600 13px var(--font-mono);letter-spacing:.08em;cursor:pointer;opacity:.28;transition:opacity .15s}.controls button:hover,.controls button:focus-visible{opacity:.95;outline:0}.controls button[aria-pressed="true"]{opacity:.95;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}.controls button:disabled{opacity:.1;cursor:default}.pips{display:flex;gap:4px;padding:0 7px;opacity:.28;transition:opacity .15s}.controls:hover .pips{opacity:.95}.pip{width:7px;height:7px;border:2px solid var(--ink);background:transparent}.pip.is-done{background:var(--ink)}
.blink{position:fixed;inset:0;z-index:99;pointer-events:none;background:var(--ground);opacity:0;transition:opacity .62s}.blink.is-out{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.stage.is-waiting:not([data-beat="3"]) .wait{opacity:.65}.stage[data-beat="3"].is-waiting .qna{opacity:1;transform:translateX(-50%)}.blink.is-out{opacity:1}}
</style>
</head>
<body>
<main class="stage" id="stage" data-beat="0">
  <section class="complete-frame"><h1>LEVEL COMPLETE</h1><p>INBOX-TO-TICKET HARNESS</p></section>
  <section class="closing-frame"><h1>Level Up How You Use AI</h1><p>งานชิ้นไหนของคุณ<br>พร้อมขยับขึ้นอีกหนึ่งระดับ?</p></section>
  <div class="flag" aria-hidden="true"></div>
  <div class="stairs" aria-label="การใช้ AI สี่ระดับ">
    <div class="step"><div class="no">01</div><div class="name">Chat</div></div>
    <div class="step"><div class="no">02</div><div class="name">Prompt Engineer</div></div>
    <div class="step"><div class="no">03</div><div class="name">Context Engineer</div></div>
    <div class="step"><div class="no">04</div><div class="name">Agent Harness</div></div>
  </div>
  <div class="cast"><div class="actor actor-human" id="human"><div class="sprite"></div></div><div class="actor actor-robot" id="robot"><div class="sprite"></div></div></div>
  <div class="qna">Q&amp;A &#9660;</div><div class="floor"></div><div class="wait">&#9660;</div>
  <div class="controls" id="controls"><button type="button" id="btn-prev" title="ถอยหลังหนึ่งจังหวะ (←)">&#9664;</button><button type="button" id="btn-next" title="เดินหน้าหนึ่งจังหวะ (→ / Space)">&#9654;</button><div class="pips" id="pips" title="จังหวะของสไลด์นี้"></div><button type="button" id="btn-reset" title="เริ่มสไลด์นี้ใหม่ (R)">&#8635;</button><button type="button" id="btn-auto" title="เดินหน้าจังหวะเองอัตโนมัติ" aria-pressed="false">AUTO</button></div>
</main>
<div class="blink" id="blink"></div>
<script src="../../assets/characters/characters.js"></script>
<script>
(function(){"use strict";
  var NEXT="",PREV="09-inbox-to-ticket.html",BEATS=3,AUTO_HOLD=[0,4300,4800,12000];
  var stage=document.getElementById("stage"),blink=document.getElementById("blink"),human=document.getElementById("human"),robot=document.getElementById("robot"),embed=parent!==window,reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var beat=0,auto=false,leaving=false,timers=[];
  function fit(){stage.style.setProperty("--stage-scale",Math.min(innerWidth/1280,innerHeight/720))}fit();addEventListener("resize",fit);
  function pose(actor,name){var svg=window.Characters&&window.Characters.svg[name];if(svg)actor.querySelector(".sprite").innerHTML=svg}
  function at(ms,fn){timers.push(setTimeout(fn,reduce?0:ms))}function clearTimers(){timers.forEach(clearTimeout);timers=[]}
  var pipsEl=document.getElementById("pips"),pips=[];for(var i=0;i<BEATS;i++){var p=document.createElement("span");p.className="pip";pipsEl.appendChild(p);pips.push(p)}
  function paint(animate){stage.dataset.beat=beat;stage.classList.toggle("is-forward",!!animate&&!reduce);pips.forEach(function(p,i){p.classList.toggle("is-done",i<beat)});stage.classList.toggle("is-waiting",beat>0&&!leaving);document.getElementById("btn-prev").disabled=leaving;document.getElementById("btn-next").disabled=leaving||(!NEXT&&beat===BEATS);if(beat===1){pose(human,animate?"human-right-walk":"human");pose(robot,"robot-left");if(animate)at(1800,function(){pose(human,"human");pose(robot,"robot")})}else{pose(human,"human");pose(robot,"robot")}}
  function setBeat(n,animate){clearTimers();beat=n;paint(animate);if(auto&&!leaving)at(AUTO_HOLD[beat],advance)}
  function advance(){if(leaving)return;if(beat<BEATS)setBeat(beat+1,true)}
  function back(){if(leaving)return;if(beat>1)setBeat(beat-1,false);else go("prev")}
  function reset(){clearTimers();blink.classList.remove("is-out");leaving=false;stage.classList.add("is-jump");beat=0;paint(false);void stage.offsetHeight;stage.classList.remove("is-jump");at(60,function(){setBeat(1,true)})}
  function go(dir){if(leaving)return;var target=dir==="prev"?PREV:NEXT;if(!target)return;leaving=true;clearTimers();paint(false);blink.classList.add("is-out");at(620,function(){if(embed)parent.postMessage({type:"slide:"+dir,from:"10-level-complete"},"*");else location.href=target})}
  var controls=document.getElementById("controls"),autoBtn=document.getElementById("btn-auto");controls.addEventListener("click",function(e){e.stopPropagation()});document.getElementById("btn-next").onclick=advance;document.getElementById("btn-prev").onclick=back;document.getElementById("btn-reset").onclick=reset;autoBtn.onclick=function(){auto=!auto;autoBtn.setAttribute("aria-pressed",auto?"true":"false");clearTimers();if(auto)at(AUTO_HOLD[beat],advance)};document.addEventListener("click",advance);document.addEventListener("keydown",function(e){if(["Enter"," ","ArrowRight","PageDown"].indexOf(e.key)>=0){e.preventDefault();advance()}else if(["ArrowLeft","PageUp"].indexOf(e.key)>=0){e.preventDefault();back()}else if(e.key==="r"||e.key==="R")reset()});reset();
})();
</script>
</body>
</html>
