<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>การใช้ AI มี 4 ระดับ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
/* ============================================================
   สไลด์ 2 — "การใช้ AI มี 4 ระดับ" เล่าเป็นบันได เปิดทีละขั้น

   beat 1..4 = ระดับ 1..4 — เสาโผล่ + คนกระโดดขึ้นไปยืน
   เสาที่ผ่านมาแล้วค้างไว้เต็มสี ไม่หรี่ พอครบ 4 เสาอยู่กึ่งกลางจอพอดี

   เหนือบันไดมี "แถบแสดงของ" กลางจอ โชว์ของของ beat ปัจจุบัน
   (แทนที่ ไม่สะสม — เสาที่ค้างอยู่ทำหน้าที่บันทึกว่าผ่านอะไรมาแล้ว)
     1 chat          กล่องแชทสองใบเกยกันเป็นเธรด
     2 prompt eng    เกยกันเหมือนกัน แต่กล่องซ้ายมีหัวข้อ/ย่อหน้า/bullets
     3 context eng   เอกสารชิ้นเดียว ชั้นกระดาษ 2 ใบ
     4 agent harness เอกสารชิ้นเดียว ชั้นกระดาษ 5 ใบ + เครื่องมือกองข้างๆ

   ข้อความในกล่องเป็นแท่งขีด ไม่ต้องอ่านออก — ประเด็นอยู่ที่ปริมาณ
   และโครงสร้าง ไม่ใช่เนื้อหา แถมกันคนดูมัวอ่านแทนที่จะฟัง

   micro loop: beat ละหนึ่ง (beat 4 สอง) รอบช้า ปิดหมดเมื่อ reduced-motion
   ไม่มีหุ่นในสไลด์นี้ — โควตา --accent เลยว่าง เอามาเน้นเลขระดับของเสา
   ที่กำลังยืนอยู่ จุดเดียวตามกติกาเดิม

   ไอคอนเครื่องมือปั้นเป็น SVG พิกเซลกริด 13x13 ทั้งหมด ไม่ใช้ Unicode
   จะได้ไม่ต้องพึ่งว่าเครื่องที่ฉายมีกลิฟไหน และคุมจุดหมุนตอนทำ loop ได้

   ปุ่มควบคุมชุดเดียวกับสไลด์ 1 (◀ ▶ pips ↺ AUTO / Space ← → R)
   ============================================================ */

html, body { height: 100%; overflow: hidden; }
body {
  display: grid;
  place-items: center;
  cursor: pointer;
  user-select: none;
}

.stage {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 1280px;
  height: 720px;
  transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
  transform-origin: center center;
  overflow: hidden;
  background: var(--ground);
}

/* ---- หัวสไลด์ ---- */
.head {
  position: absolute;
  left: 50%;
  top: 44px;
  transform: translateX(-50%);
  padding: 16px 46px;
  background: var(--ground-light);
  border: 4px solid var(--ink);
  box-shadow: inset 0 0 0 3px var(--ground-light), inset 0 0 0 4px var(--ash);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 38px;
  letter-spacing: .02em;
  line-height: 1.2;
  color: var(--ink);
  white-space: nowrap;
}

/* ---- พื้น ---- */
.floor {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 28px;
  height: 3px;
  background: var(--ash);
  opacity: .5;
}

/* ---- บันได — 4 เสา กว้าง 210 รวม 840 วางที่ x 220..1060 = กึ่งกลางจอ ---- */
.step {
  position: absolute;
  bottom: 28px;
  width: 210px;
  background: var(--ground-light);
  border: 4px solid var(--ink);
  border-bottom: none;
  box-sizing: border-box;
  padding: 11px 10px 0;
  text-align: center;
  opacity: 0;
  transform: translateY(22px);
  transition: opacity .38s ease-out, transform .38s cubic-bezier(.16, 1, .3, 1);
}
.step.is-on { opacity: 1; transform: translateY(0); }

/* เสาที่คนกำลังยืนอยู่ — ขอบบนหนาขึ้น + เลขระดับเป็นสีเน้น */
.step.is-here { border-top-width: 8px; padding-top: 7px; }
.step.is-here .no { color: var(--accent); }

.step .no {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: .18em;
  color: var(--ink-soft);
  transition: color .25s;
}
.step .name {
  margin-top: 3px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 18px;
  line-height: 1.2;
  color: var(--ink);
  text-transform: uppercase;
  white-space: nowrap;
}

/* ---- คน — 120px = 60% ของขนาดในสไลด์ 1 ---- */
.actor {
  position: absolute;
  --char-size: 120px;
  left: var(--hx, -170px);
  bottom: var(--hy, 28px);
  transition: left .52s cubic-bezier(.34, .1, .3, 1),
              bottom .52s cubic-bezier(.2, .9, .3, 1);
  z-index: 3;
}
.actor .char { height: var(--char-size); }

/* ============================================================
   แถบแสดงของ — กลางจอ เหนือบันได y 150..326
   padding ล่าง 20px ไว้ให้หางบอลลูนห้อยลงมาได้โดยไม่ดันความสูง
   ============================================================ */
.props {
  position: absolute;
  left: 0;
  right: 0;
  top: 150px;
  height: 176px;
  box-sizing: border-box;
  padding-bottom: 20px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 46px;
  z-index: 2;
}
.props > * { animation: propIn .38s cubic-bezier(.16, 1, .3, 1) both; }
.props > :nth-child(2) { animation-delay: .09s; }
@keyframes propIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---- เธรดแชท: สองกล่องเกยกัน ---- */
.thread { position: relative; display: flex; flex-direction: column; }
.chat {
  position: relative;
  box-sizing: border-box;
  padding: 10px 14px;
  background: var(--ground-light);
  border: 4px solid var(--ink);
}
.chat.from-right {
  align-self: flex-end;
  margin-top: -14px;      /* ค่าติดลบนี่แหละที่ทำให้เกยกัน */
  margin-right: -34px;
  z-index: 2;
}
.chat::after {
  content: "";
  position: absolute;
  bottom: -15px;
  width: 11px;
  height: 11px;
  background: var(--ground-light);
  border-bottom: 4px solid var(--ink);
}
.chat.from-left::after  { left: 20px;  border-left: 4px solid var(--ink); }
.chat.from-right::after { right: 20px; border-right: 4px solid var(--ink); }

/* ---- เอกสาร (มีมุมพับ) + ชั้นกระดาษซ้อนไปทางซ้าย-ล่าง ---- */
.stack { position: relative; }
.stack .ghost {
  position: absolute;
  bottom: 0;
  box-sizing: border-box;
  background: var(--ground-light);
  border: 4px solid var(--ink);
  z-index: 0;
}
.doc {
  position: relative;
  z-index: 1;
  box-sizing: border-box;
  padding: 15px 13px 13px;
  background: var(--ground-light);
  border: 4px solid var(--ink);
}
.doc::before {                      /* มุมพับขวาบน */
  content: "";
  position: absolute;
  top: -4px;
  right: -4px;
  width: 22px;
  height: 22px;
  background: var(--ground);
  border-left: 4px solid var(--ink);
  border-bottom: 4px solid var(--ink);
}

/* ---- แท่งขีดแทนข้อความ ---- */
.line {
  height: 7px;
  margin-bottom: 6px;
  background: var(--ink-soft);
  opacity: .5;
}
.line:last-child { margin-bottom: 0; }
.line.head-line { height: 10px; margin-bottom: 8px; opacity: .75; }
.bullet { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.bullet:last-child { margin-bottom: 0; }
.bullet i {
  flex: 0 0 auto;
  width: 7px;
  height: 7px;
  background: var(--ink);
  opacity: .6;
}
.bullet .line { margin-bottom: 0; }
.gap { height: 4px; }

/* ---- เครื่องมือ: กองชิดกันถัดจากเอกสาร ---- */
.tools {
  width: 252px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.icon { display: block; width: 46px; height: 46px; color: var(--ink); }
.term {
  box-sizing: border-box;
  width: 108px;
  background: var(--ground-light);
  border: 4px solid var(--ink);
}
.term .bar {
  height: 14px;
  background: var(--sign);
  border-bottom: 4px solid var(--ink);
}
.term .body {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 9px 10px 10px;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 18px;
  line-height: 1;
  color: var(--ink);
}

/* ============================================================
   micro loop — beat ละหนึ่ง (beat 4 สอง) รอบช้า ไม่แย่งสายตาคนพูด
   ============================================================ */

/* 01 — จุดสามจุดวิ่งในกล่องขวา แบบ typing indicator */
.dots { display: flex; align-items: center; gap: 7px; height: 21px; }
.dots i {
  width: 9px;
  height: 9px;
  background: var(--ink-soft);
  opacity: .3;
  animation: dotPulse 1.5s steps(1, end) infinite;
}
.dots i:nth-child(2) { animation-delay: .3s; }
.dots i:nth-child(3) { animation-delay: .6s; }
@keyframes dotPulse { 0%, 60% { opacity: .85 } 61%, 100% { opacity: .25 } }

/* 02 — เคอร์เซอร์กะพริบท้ายบรรทัดสุดท้าย */
.caret {
  width: 6px;
  height: 15px;
  background: var(--ink);
  animation: caretBlink 1.1s steps(1, end) infinite;
}
@keyframes caretBlink { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }

/* 03 — กระดาษใบบนสุดขยับขึ้นลงช้าๆ */
.stack.breathe .doc { animation: paperBreathe 2.8s ease-in-out infinite; }
@keyframes paperBreathe {
  0%, 100% { transform: translateY(0) }
  50%      { transform: translateY(-3px) }
}

/* 04 — แว่นขยายส่ายซ้ายขวา + เคอร์เซอร์ terminal กะพริบ
   (ถ้าอยากให้เฟืองหมุนด้วย เปิดบล็อก .icon-gear ข้างล่าง — ใช้ steps(8)
   กระโดดทีละฟัน ห้ามหมุนเนียน ไม่งั้นหลุดจากภาษาพิกเซล) */
.icon-mag { transform-origin: 38% 38%; animation: magSway 2.6s ease-in-out infinite; }
@keyframes magSway {
  0%, 100% { transform: rotate(-9deg) }
  50%      { transform: rotate(9deg) }
}
/* .icon-gear { animation: gearSpin 4s steps(8, end) infinite; }
   @keyframes gearSpin { to { transform: rotate(360deg) } } */

/* ---- ตัวบอกว่ารอคลิก ---- */
.wait {
  position: absolute;
  left: 50%;
  bottom: 11px;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 17px;
  color: var(--ink);
  opacity: 0;
}
.stage.is-waiting .wait {
  animation: waitIn .3s ease-out both, waitBlink 1.25s steps(1, end) .3s infinite;
}
@keyframes waitIn    { from { opacity: 0 } to { opacity: 1 } }
@keyframes waitBlink { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }

/* ---- ปุ่มควบคุม มุมล่างขวา ----
   ไม่มีกรอบปุ่ม เหลือแค่กลิฟจางๆ ชัดตอน hover — ตอนฉายจริงแทบมองไม่เห็น
   แต่พื้นที่กดยังกว้างเท่าเดิมเพราะใช้ padding ไม่ได้ย่อ hit area */
.controls {
  position: absolute;
  right: 16px;
  bottom: 8px;
  display: flex;
  align-items: center;
  gap: 2px;
  z-index: 5;
}
.controls button {
  padding: 7px 9px;
  background: none;
  border: 0;
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .08em;
  line-height: 1;
  cursor: pointer;
  opacity: .28;
  transition: opacity .15s;
}
.controls button:hover,
.controls button:focus-visible { opacity: .95; outline: none; }
.controls button[aria-pressed="true"] {
  opacity: .95;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-thickness: 2px;
}
.controls button:disabled { opacity: .1; cursor: default; }

/* ตัวบอก beat — ทึบ = ผ่าน/อยู่ตรงนี้ / โปร่ง = ยังไม่ถึง */
.pips { display: flex; gap: 4px; padding: 0 7px; opacity: .28; transition: opacity .15s; }
.controls:hover .pips { opacity: .95; }
.pip { width: 7px; height: 7px; border: 2px solid var(--ink); background: transparent; }
.pip.is-done { background: var(--ink); }

/* ---- exit ---- */
.blink {
  position: fixed;
  inset: 0;
  background: var(--ink);
  opacity: 0;
  pointer-events: none;
  z-index: 99;
}
.blink.is-out { animation: doorBlink .62s steps(1, end) forwards; }
@keyframes doorBlink {
  0% { opacity: 0 } 14% { opacity: 1 } 28% { opacity: 0 }
  42% { opacity: 1 } 56% { opacity: 0 } 70% { opacity: 1 } 100% { opacity: 1 }
}

@media (prefers-reduced-motion: reduce) {
  .step, .actor { transition: none; }
  .props > *, .dots i, .caret, .stack.breathe .doc, .icon-mag { animation: none; }
  .stage.is-waiting .wait { animation: none; opacity: 1; }
  .blink.is-out { animation: none; opacity: 1; }
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="head">การใช้ AI มี 4 ระดับ</div>

  <div class="floor"></div>

  <div class="props" id="props"></div>

  <div id="stairs"></div>

  <div class="actor" id="human"><div class="sprite" data-char="human-right"></div></div>

  <div class="wait">&#9660;</div>

  <div class="controls" id="controls">
    <button type="button" id="btn-prev"  title="ถอยหลังหนึ่งจังหวะ (←)">&#9664;</button>
    <button type="button" id="btn-next"  title="เดินหน้าหนึ่งจังหวะ (→ / Space)">&#9654;</button>
    <div class="pips" id="pips" title="จังหวะของสไลด์นี้"></div>
    <button type="button" id="btn-reset" title="เริ่มสไลด์นี้ใหม่ (R)">&#8635;</button>
    <button type="button" id="btn-auto"  title="เดินหน้าจังหวะเองอัตโนมัติ" aria-pressed="false">AUTO</button>
  </div>
</div>

<div class="blink" id="blink"></div>

<script src="../../assets/characters/characters.js"></script>
<script>
(function () {
  "use strict";

  var NEXT = "03-examples.html";
  var PREV = "01-title.html";

  /* ---- เรขาคณิตของบันได (หน่วย px ของเวที 1280x720) ---- */
  var STEP_W   = 210;
  var STEP_X0  = 220;           /* 220 + 4*210 = 1060 → กึ่งกลางจอ 640 พอดี */
  var SURFACE0 = 124;
  var RISE     = 48;
  var GROUND   = 28;
  var HUMAN_W  = 120 * 40 / 51;

  /* ============================================================
     ไอคอนเครื่องมือ — วาดบนกริด 13x13 เป็น [x, y, w, h]
     ink[] = ส่วนที่เป็นตัวไอคอน / hole[] = ส่วนที่เจาะทะลุเห็นพื้นหลัง
     ============================================================ */
  var ICONS = {
    gear: {
      ink: [[3, 3, 7, 7],                       /* ตัวเฟือง */
            [5, 0, 3, 3], [5, 10, 3, 3],        /* ฟันบน–ล่าง */
            [0, 5, 3, 3], [10, 5, 3, 3],        /* ฟันซ้าย–ขวา */
            [2, 2, 2, 2], [9, 2, 2, 2],         /* ฟันแนวทแยงบน */
            [2, 9, 2, 2], [9, 9, 2, 2]],        /* ฟันแนวทแยงล่าง */
      hole: [[5, 5, 3, 3]]
    },
    mag: {                                       /* แว่นขยาย */
      ink: [[3, 0, 4, 1], [2, 1, 1, 1], [7, 1, 1, 1],
            [1, 2, 1, 4], [8, 2, 1, 4],          /* ขอบเลนส์ซ้าย–ขวา */
            [2, 6, 1, 1], [3, 7, 5, 1],          /* ขอบล่าง */
            [8, 8, 2, 2], [9, 9, 2, 2],          /* ด้ามจับแนวทแยง */
            [10, 10, 2, 2], [11, 11, 2, 2]],
      hole: []
    },
    plug: {                                      /* ปลั๊ก */
      ink: [[3, 0, 2, 3], [8, 0, 2, 3],          /* ขาปลั๊ก */
            [1, 3, 11, 5],                       /* ตัวปลั๊ก */
            [4, 8, 5, 2],                        /* คอ */
            [5, 10, 3, 3]],                      /* สาย */
      hole: []
    },
    db: {                                        /* ฐานข้อมูล */
      ink: [[3, 0, 7, 1], [1, 1, 11, 3],
            [1, 5, 11, 3],
            [1, 9, 11, 3], [3, 12, 7, 1]],
      hole: []
    },
    link: {                                      /* ลิงก์สองห่วงคล้องกัน */
      ink: [[0, 3, 7, 2], [0, 8, 7, 2], [0, 5, 2, 3], [5, 5, 2, 3],
            [6, 3, 7, 2], [6, 8, 7, 2], [6, 5, 2, 3], [11, 5, 2, 3]],
      hole: []
    }
  };

  function rects(list, fill) {
    return list.map(function (r) {
      return '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] +
             '" height="' + r[3] + '" fill="' + fill + '"/>';
    }).join("");
  }
  function icon(name) {
    var d = ICONS[name];
    return '<svg class="icon icon-' + name + '" viewBox="0 0 13 13" ' +
           'shape-rendering="crispEdges" aria-hidden="true">' +
           rects(d.ink, "currentColor") + rects(d.hole, "var(--ground)") + '</svg>';
  }

  /* ---- ชิ้นส่วนอื่น ---- */
  function lines(widths, cls) {
    return widths.map(function (w) {
      return '<div class="line ' + (cls || "") + '" style="width:' + w + 'px"></div>';
    }).join("");
  }
  function bullets(widths) {
    return widths.map(function (w) {
      return '<div class="bullet"><i></i><div class="line" style="width:' + w + 'px"></div></div>';
    }).join("");
  }
  function chat(side, w, inner) {
    return '<div class="chat from-' + side + '" style="width:' + w + 'px">' + inner + '</div>';
  }
  function thread(w, left, right) {
    return '<div class="thread" style="width:' + w + 'px">' + left + right + '</div>';
  }
  /* เอกสาร + ชั้นกระดาษ sheets ใบ (ซ้อนเยื้องไปทางซ้าย-ล่าง ก้นเสมอกัน) */
  function stack(w, h, inner, sheets, breathe) {
    var g = "";
    for (var k = sheets - 1; k >= 1; k--) {
      g += '<i class="ghost" style="left:-' + (k * 11) + 'px;top:' + (k * 8) +
           'px;width:' + w + 'px"></i>';
    }
    return '<div class="stack' + (breathe ? " breathe" : "") +
           '" style="width:' + w + 'px;height:' + h + 'px">' + g +
           '<div class="doc" style="width:' + w + 'px;height:' + h + 'px">' +
           '<div class="line head-line" style="width:' + Math.round(w * .44) + 'px"></div>' +
           inner + '</div></div>';
  }
  function term() {
    return '<div class="term"><div class="bar"></div>' +
           '<div class="body">&gt;<span class="caret"></span></div></div>';
  }

  /* ---- ของของแต่ละ beat ---- */
  var PROPS = {
    /* 01 — ถาม-ตอบสั้นๆ กล่องขวากำลังพิมพ์อยู่ */
    1: thread(250,
         chat("left", 186, lines([140, 96])),
         chat("right", 132, '<div class="dots"><i></i><i></i><i></i></div>')),

    /* 02 — กล่องซ้ายมีโครงสร้าง หัวข้อ / ย่อหน้า / bullets + เคอร์เซอร์ */
    2: thread(340,
         chat("left", 296,
           '<div class="line head-line" style="width:150px"></div>' +
           lines([256, 210]) +
           bullets([180, 214]) +
           '<div class="bullet"><i></i><div class="line" style="width:120px"></div>' +
           '<span class="caret"></span></div>'),
         chat("right", 140, lines([104, 76]))),

    /* 03 — เอกสารชิ้นเดียว ชั้นกระดาษ 2 ใบ */
    3: stack(150, 118, lines([120, 96, 128, 84]), 2, true),

    /* 04 — เอกสารชิ้นเดียว ชั้นกระดาษ 5 ใบ + เครื่องมือกองข้างๆ */
    4: stack(150, 118, lines([120, 96, 128, 84]), 5, false) +
       '<div class="tools">' + term() + icon("gear") + icon("mag") +
       icon("plug") + icon("db") + icon("link") + '</div>'
  };

  var LEVELS = [
    { no: "01", name: "Chat" },
    { no: "02", name: "Prompt Engineer" },
    { no: "03", name: "Context Engineer" },
    { no: "04", name: "Agent Harness" }
  ];

  var BEATS     = LEVELS.length;
  var AUTO_HOLD = [0, 2600, 2600, 2600, 6000];

  var stage   = document.getElementById("stage");
  var propsEl = document.getElementById("props");
  var blink   = document.getElementById("blink");
  var embed   = window.parent !== window;
  var reduce  = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function fit() {
    stage.style.setProperty("--stage-scale",
      Math.min(window.innerWidth / 1280, window.innerHeight / 720));
  }
  fit();
  window.addEventListener("resize", fit);

  /* ---- สร้างเสา ---- */
  var stairs = document.getElementById("stairs");
  var steps = LEVELS.map(function (lv, i) {
    var el = document.createElement("div");
    el.className = "step";
    el.style.left   = (STEP_X0 + i * STEP_W) + "px";
    el.style.height = (SURFACE0 + i * RISE - GROUND) + "px";
    el.innerHTML = '<div class="no">' + lv.no + '</div>' +
                   '<div class="name">' + lv.name + '</div>';
    stairs.appendChild(el);
    return el;
  });

  function surfaceOf(i) { return SURFACE0 + i * RISE; }
  function humanXOf(i)  { return STEP_X0 + i * STEP_W + (STEP_W - HUMAN_W) / 2; }

  /* ---- beat state ---- */
  var beat = 0, shownProps = -1, auto = false, leaving = false;
  var timers = [];
  function at(ms, fn) { timers.push(setTimeout(fn, reduce ? 0 : ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  var pipsEl = document.getElementById("pips");
  var pips = LEVELS.map(function () {
    var p = document.createElement("span");
    p.className = "pip";
    pipsEl.appendChild(p);
    return p;
  });

  function paint() {
    pips.forEach(function (p, i) { p.classList.toggle("is-done", i < beat); });
    steps.forEach(function (el, i) {
      el.classList.toggle("is-on", i < beat);
      el.classList.toggle("is-here", i === beat - 1);
    });
    stage.classList.toggle("is-waiting", beat > 0 && !leaving);
    document.getElementById("btn-prev").disabled = (beat <= 1 && !embed && !PREV);
    document.getElementById("btn-next").disabled = leaving;

    if (beat === 0) {
      stage.style.setProperty("--hx", "-170px");
      stage.style.setProperty("--hy", GROUND + "px");
    } else {
      stage.style.setProperty("--hx", Math.round(humanXOf(beat - 1)) + "px");
      stage.style.setProperty("--hy", surfaceOf(beat - 1) + "px");
    }

    if (shownProps !== beat) {          /* วาดของใหม่เฉพาะตอน beat เปลี่ยนจริง */
      shownProps = beat;
      propsEl.innerHTML = PROPS[beat] || "";
    }
  }

  function armAuto() { if (auto && !leaving) at(AUTO_HOLD[beat], advance); }

  function setBeat(n) {
    clearTimers();
    beat = n;
    paint();
    armAuto();
  }

  function advance() {
    if (leaving) return;
    if (beat < BEATS) setBeat(beat + 1);
    else go("next");
  }

  function back() {
    if (leaving) return;
    if (beat > 1) setBeat(beat - 1);
    else go("prev");
  }

  function reset() {
    clearTimers();
    blink.classList.remove("is-out");
    leaving = false;
    setBeat(0);
    at(60, function () { setBeat(1); });
  }

  function go(dir) {
    if (leaving) return;
    var target = dir === "prev" ? PREV : NEXT;
    if (!embed && !target) return;
    leaving = true;
    clearTimers();
    paint();
    blink.classList.add("is-out");
    setTimeout(function () {
      if (embed) {
        window.parent.postMessage({ type: "slide:" + dir, from: "02-levels" }, "*");
      } else {
        window.location.href = target;
      }
    }, reduce ? 0 : 620);
  }

  /* ---- ปุ่มควบคุม ---- */
  var controls = document.getElementById("controls");
  var btnAuto  = document.getElementById("btn-auto");
  controls.addEventListener("click", function (e) { e.stopPropagation(); });

  document.getElementById("btn-next").addEventListener("click", advance);
  document.getElementById("btn-prev").addEventListener("click", back);
  document.getElementById("btn-reset").addEventListener("click", reset);
  btnAuto.addEventListener("click", function () {
    auto = !auto;
    btnAuto.setAttribute("aria-pressed", auto ? "true" : "false");
    clearTimers();
    armAuto();
  });

  document.addEventListener("click", advance);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight" || e.key === "PageDown") {
      e.preventDefault(); advance();
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault(); back();
    } else if (e.key === "r" || e.key === "R") {
      reset();
    }
  });

  paint();
  at(220, function () { setBeat(1); });
})();
</script>
</body>
</html>
