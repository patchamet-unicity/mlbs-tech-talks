<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระดับ 01 — Chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
/* ============================================================
   สไลด์ 3 — "ระดับ 01 Chat" เล่าด้วยบทสนทนาจริง

   ต่างจากสไลด์ 1–2 ตรงที่ "ข้อความอ่านออก" เพราะเนื้อบทคือสาระ
   ไม่ใช่รูปทรง — คนดูต้องอ่านตามได้ว่า AI เดาผิดกี่รอบ

   1 beat = 1 ข้อความ (ไม่ใช่ 1 คู่สนทนา) รวม 17 beat
     beat 1..10  ไล่เดา 4 รอบ แล้ว AI ขอ context เอง  (จุดเปลี่ยนที่ข้อความ 10)
     beat 11..17 พอมี log + โค้ด ก็จบงานได้ใน 3 คู่สนทนา แล้วปิดท้ายด้วย 🙂👌

   ใต้กล่องแชทมีฉากวนไม่รู้จบ ไม่ผูกกับ beat — คนเรียกหุ่นออกมาจากห้องทำงาน
   คุยกัน แล้วหุ่นกลับเข้าห้อง 3 รอบ รอบสุดท้ายคนขึ้น ✅ แล้ววนใหม่

   กล่องแชทสูงคงที่ ข้อความกองจากล่างขึ้นบน (.feed ยึด bottom)
   ล้นแล้วโดน overflow:hidden ตัด + mask ไล่จางที่ขอบบน
   ข้อความเก่าเลื่อนขึ้นหายไปเรื่อยๆ เห็นแต่ที่เพิ่งคุยกัน — เหมือนแชทจริง

   วิธีทำให้ "เลื่อนขึ้น" ลื่น: ข้อความใหม่เกิดมาพร้อม margin-top ติดลบ
   เท่าความสูงตัวเอง (กองไม่ขยับ) แล้ว transition กลับเป็น 0
   → ทั้งกองถูกดันขึ้นพร้อมกัน ดูเป็นการ scroll

   micro loop เดียว: จุดสามจุด "AI กำลังพิมพ์" โผล่ทุกครั้งที่ตาเป็นของ AI
   --accent ใช้จุดเดียว = ป้ายจุดเปลี่ยนที่ข้อความ 10

   ปุ่มควบคุมชุดเดียวกับสไลด์ 1–2 แต่เปลี่ยน pips เป็นเลข n/17
   เพราะจุดเยอะขนาดนั้นยาวเป็นแถบรกจอ
   ============================================================ */

html, body { height: 100%; overflow: hidden; }
body {
  display: grid;
  place-items: center;
  cursor: pointer;
  user-select: none;
}

.stage {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 1280px;
  height: 720px;
  transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
  transform-origin: center center;
  overflow: hidden;
  background: var(--ground);
}

/* ---- หัวสไลด์ ---- */
.head {
  position: absolute;
  left: 50%;
  top: 22px;
  transform: translateX(-50%);
  padding: 10px 36px;
  background: var(--ground-light);
  border: 4px solid var(--ink);
  box-shadow: inset 0 0 0 3px var(--ground-light), inset 0 0 0 4px var(--ash);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 28px;
  letter-spacing: .02em;
  line-height: 1.2;
  color: var(--ink);
  white-space: nowrap;
}

/* ============================================================
   หน้าต่างแชท
   ============================================================ */
.chatbox {
  position: absolute;
  left: 190px;
  top: 100px;
  width: 900px;
  height: 440px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  background: var(--ground-light);
  border: 4px solid var(--ink);
}

.chatbox .bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 16px;
  box-sizing: border-box;
  background: var(--sign);
  border-bottom: 4px solid var(--ink);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 17px;
  color: var(--ink);
}
.chatbox .bar b {
  width: 11px;
  height: 11px;
  background: var(--ink);
  opacity: .55;
}

/* ช่องมองเห็น — ตัดข้อความที่ล้นออกด้านบน แล้วไล่จางไม่ให้ตัดกึกกัก */
.viewport {
  position: relative;
  flex: 1 1 auto;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom,
                       rgba(0,0,0,0) 0, rgba(0,0,0,.12) 22px, #000 92px);
          mask-image: linear-gradient(to bottom,
                       rgba(0,0,0,0) 0, rgba(0,0,0,.12) 22px, #000 92px);
}

/* กองจากล่างขึ้นบน — ข้อความใหม่อยู่ล่างสุดเสมอ */
.feed {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 20px 24px 18px;
  box-sizing: border-box;
}

/* ---- ข้อความ ---- */
.msg { display: flex; padding-top: 15px; }
.msg.you { justify-content: flex-end; }

.msg .col { display: flex; flex-direction: column; max-width: 620px; }
.msg.you .col { align-items: flex-end; }

.who {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  padding: 0 2px;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .16em;
  color: var(--ink-soft);
}
/* avatar หัวคน/หัวหุ่น — เส้นทึบสีเดียว ไม่ลงสี ให้พอดูออกว่าใครพูด
   ปั้นเป็น SVG พิกเซลกริด 13x13 เหมือนไอคอนเครื่องมือในสไลด์ 2
   ไม่มี rect เจาะพื้นหลังเลย ตา/ปากเป็นช่องว่างล้วน จะได้วางบนพื้นสีอะไรก็ได้ */
.av {
  flex: 0 0 auto;
  display: block;
  width: 26px;
  height: 26px;
  color: var(--ink-soft);
  opacity: .85;
}

.bub {
  box-sizing: border-box;
  padding: 10px 16px 12px;
  border: 3px solid var(--ink);
  background: var(--ground-light);
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 22px;
  line-height: 1.45;
  color: var(--ink);
}
.msg.you .bub { background: var(--frame); }   /* ฝั่งเรา = ครีมเหลือง แยกด้วยสี ไม่ต้องพึ่งตำแหน่งอย่างเดียว */
.msg.emo .bub { padding: 6px 18px 10px; font-size: 34px; line-height: 1.2; }
.bub p { margin: 0; }
.bub p + p { margin-top: 5px; }

/* ---- ป้ายจุดเปลี่ยน (ใช้ --accent จุดเดียวของสไลด์) ---- */
.mark {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 16px;
  color: var(--accent);
}
.mark i {
  width: 10px;
  height: 10px;
  background: var(--accent);
  animation: markBlink 1.6s steps(1, end) infinite;
}
@keyframes markBlink { 0%, 60% { opacity: 1 } 61%, 100% { opacity: .25 } }

/* ---- รูปหน้าจอที่แนบมา ---- */
.shot {
  width: 208px;
  margin-top: 10px;
  background: var(--ground-light);
  border: 3px solid var(--ink);
}
.shot .top { height: 15px; background: var(--sign); border-bottom: 3px solid var(--ink); }
.shot .body {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  padding: 13px 14px 15px;
}
.warn { display: block; width: 34px; height: 34px; color: var(--ink); }
.shot .line { height: 7px; background: var(--ink-soft); opacity: .45; }
.shot .btn { width: 96px; height: 21px; background: var(--ash); }

/* ---- log + โค้ดที่แนบมา ---- */
.log {
  margin-top: 10px;
  padding: 10px 13px;
  background: var(--ground);
  border: 3px solid var(--ink);
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink);
  white-space: pre;
  overflow: hidden;
}

/* ---- micro loop: AI กำลังพิมพ์ ---- */
.dots { display: flex; align-items: center; gap: 7px; height: 25px; }
.dots i {
  width: 9px;
  height: 9px;
  background: var(--ink-soft);
  opacity: .3;
  animation: dotPulse 1.5s steps(1, end) infinite;
}
.dots i:nth-child(2) { animation-delay: .3s; }
.dots i:nth-child(3) { animation-delay: .6s; }
@keyframes dotPulse { 0%, 60% { opacity: .85 } 61%, 100% { opacity: .25 } }

/* ============================================================
   ฉากล่างกล่องแชท y 540..720 — วนไม่รู้จบ ไม่ผูกกับ beat
   หุ่นอยู่ห้องทำงานฝั่งซ้าย คนยืนรอฝั่งขวา
   คนเรียก → หุ่นออกจากห้องมาหา → คุยกัน → หุ่นกลับเข้าห้อง
   3 รอบ รอบสุดท้ายหุ่นตอบแล้วคนขึ้น ✅ แล้ววนใหม่
   ============================================================ */
.scene {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 180px;
}
.scene .floor {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 30px;
  height: 3px;
  background: var(--ash);
  opacity: .5;
}

/* ---- ห้องทำงานของหุ่น ---- */
.booth {
  position: absolute;
  left: 328px;
  bottom: 30px;
  width: 172px;
  height: 120px;
  box-sizing: border-box;
  background: var(--ground-light);
  border: 4px solid var(--ink);
}
.booth .sign {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 9px;
  background: var(--sign);
  border-bottom: 4px solid var(--ink);
}
.booth .sign i { width: 7px; height: 7px; background: var(--ink); opacity: .5; }
.booth .room { position: relative; height: 86px; }
.booth .mon {
  position: absolute;
  left: 13px;
  top: 12px;
  width: 58px;
  height: 42px;
  box-sizing: border-box;
  padding: 7px 6px;
  background: var(--ground);
  border: 3px solid var(--ink);
}
.booth .mon span { display: block; height: 4px; margin-bottom: 5px; background: var(--ink-soft); opacity: .5; }
.booth .mon span:nth-child(1) { width: 38px; }
.booth .mon span:nth-child(2) { width: 24px; }
.booth .mon span:nth-child(3) { width: 31px; margin-bottom: 0; }
.booth .desk {
  position: absolute;
  left: 7px;
  bottom: 12px;
  width: 70px;
  height: 5px;
  background: var(--ink);
  opacity: .75;
}
/* ช่องประตู — พื้นสีเดียวกับพื้นสไลด์ = ช่องโหว่ หุ่นเดินเข้าไปแล้วหายลับ */
.booth .door {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 54px;
  height: 78px;
  box-sizing: border-box;
  background: var(--ground);
  border-left: 4px solid var(--ink);
  border-top: 4px solid var(--ink);
}

/* ---- ตัวละคร 30% ของสไลด์ 1 ---- */
.pawn {
  position: absolute;
  --char-size: 60px;
  bottom: 30px;
  left: 0;
  transform: translateX(var(--x, 0));
  opacity: 1;
  transition: opacity .22s linear;
}
.pawn .char { height: var(--char-size); }
.pawn.is-hidden { opacity: 0; }
.pawn-bot { transition: transform var(--walk, 2s) linear, opacity .22s linear; }

/* ---- บอลลูนเหนือหัว ---- */
.say {
  position: absolute;
  left: 50%;
  bottom: calc(var(--char-size) + 9px);
  transform: translateX(-50%) scale(.7);
  padding: 4px 10px 5px;
  background: var(--ground-light);
  border: 3px solid var(--ink);
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 14px;
  line-height: 1.2;
  color: var(--ink);
  white-space: nowrap;
  opacity: 0;
  transition: opacity .16s ease-out, transform .16s cubic-bezier(.16, 1, .3, 1);
}
.say::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -12px;
  margin-left: -5px;
  width: 9px;
  height: 9px;
  background: var(--ground-light);
  border-right: 3px solid var(--ink);
  border-bottom: 3px solid var(--ink);
}
.say.is-on { opacity: 1; transform: translateX(-50%) scale(1); }
.say.is-emo { font-family: var(--font-body); font-size: 19px; padding: 2px 10px 4px; }

/* ---- ตัวบอกว่ารอคลิก ---- */
.wait {
  position: absolute;
  left: 50%;
  bottom: 11px;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 17px;
  color: var(--ink);
  opacity: 0;
}
.stage.is-waiting .wait {
  animation: waitIn .3s ease-out both, waitBlink 1.25s steps(1, end) .3s infinite;
}
@keyframes waitIn    { from { opacity: 0 } to { opacity: 1 } }
@keyframes waitBlink { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }

/* ---- ปุ่มควบคุม มุมล่างขวา (ชุดเดียวกับสไลด์ 1–2) ---- */
.controls {
  position: absolute;
  right: 16px;
  bottom: 8px;
  display: flex;
  align-items: center;
  gap: 2px;
  z-index: 5;
}
.controls button {
  padding: 7px 9px;
  background: none;
  border: 0;
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .08em;
  line-height: 1;
  cursor: pointer;
  opacity: .28;
  transition: opacity .15s;
}
.controls button:hover,
.controls button:focus-visible { opacity: .95; outline: none; }
.controls button[aria-pressed="true"] {
  opacity: .95;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-thickness: 2px;
}
.controls button:disabled { opacity: .1; cursor: default; }

/* 16 beat เยอะเกินกว่าจะทำ pips — ใช้เลข n/16 แทน */
.count {
  padding: 0 7px;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .08em;
  color: var(--ink);
  opacity: .28;
  transition: opacity .15s;
}
.controls:hover .count { opacity: .95; }

/* ---- exit ---- */
.blink {
  position: fixed;
  inset: 0;
  background: var(--ink);
  opacity: 0;
  pointer-events: none;
  z-index: 99;
}
.blink.is-out { animation: doorBlink .62s steps(1, end) forwards; }
@keyframes doorBlink {
  0% { opacity: 0 } 14% { opacity: 1 } 28% { opacity: 0 }
  42% { opacity: 1 } 56% { opacity: 0 } 70% { opacity: 1 } 100% { opacity: 1 }
}

@media (prefers-reduced-motion: reduce) {
  .msg { transition: none !important; }
  .dots i, .mark i { animation: none; }
  .pawn, .pawn-bot, .say { transition: none; }
  .stage.is-waiting .wait { animation: none; opacity: 1; }
  .blink.is-out { animation: none; opacity: 1; }
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="head">ระดับ 01 — Chat</div>

  <div class="chatbox">
    <div class="bar"><b></b>IT Support — ลูกค้าสร้าง order ไม่ได้</div>
    <div class="viewport"><div class="feed" id="feed"></div></div>
  </div>

  <div class="scene" id="scene">
    <div class="floor"></div>
    <div class="booth">
      <div class="sign"><i></i><i></i><i></i></div>
      <div class="room">
        <div class="mon"><span></span><span></span><span></span></div>
        <div class="desk"></div>
        <div class="door"></div>
      </div>
    </div>
    <div class="pawn pawn-bot" id="bot">
      <div class="say" id="bot-say"></div>
      <div class="sprite" data-char="robot-right"></div>
    </div>
    <div class="pawn pawn-you" id="guy">
      <div class="say" id="guy-say"></div>
      <div class="sprite" data-char="human"></div>
    </div>
  </div>

  <div class="wait">&#9660;</div>

  <div class="controls" id="controls">
    <button type="button" id="btn-prev"  title="ถอยหลังหนึ่งข้อความ (←)">&#9664;</button>
    <button type="button" id="btn-next"  title="ข้อความถัดไป (→ / Space)">&#9654;</button>
    <div class="count" id="count" title="ข้อความที่เท่าไหร่">0/17</div>
    <button type="button" id="btn-reset" title="เริ่มสไลด์นี้ใหม่ (R)">&#8635;</button>
    <button type="button" id="btn-auto"  title="เดินหน้าเองอัตโนมัติ" aria-pressed="false">AUTO</button>
  </div>
</div>

<div class="blink" id="blink"></div>

<script src="../../assets/characters/characters.js"></script>
<script>
(function () {
  "use strict";

  var NEXT = "04-prompt.html";
  var PREV = "02-levels.html";

  /* ============================================================
     บทสนทนา — 1 ข้อความ = 1 beat
     who : "you" ฝั่งเรา (ขวา ครีมเหลือง) / "ai" ฝั่ง AI (ซ้าย)
     p[] : ย่อหน้า
     shot / log : ของแนบ / mark : ป้ายจุดเปลี่ยน
     ============================================================ */
  var MSGS = [
    { who: "you", p: ["ลูกค้าสร้าง order ไม่ได้ครับ log ขึ้น error 00412"] },
    { who: "ai",  p: ["error 00412 คือรหัสสินค้าหมดสต็อกครับ",
                      "ให้ลูกค้าลองเลือกสินค้าตัวอื่นดูนะครับ"] },

    { who: "you", p: ["สินค้ามีสต็อกอยู่ 200 ชิ้น"] },
    { who: "ai",  p: ["งั้นน่าจะเป็นปัญหา cache ครับ ลองล้าง cache แล้วสั่งใหม่อีกครั้ง"] },

    { who: "you", p: ["ล้างแล้ว ยังเหมือนเดิม"], shot: true },
    { who: "ai",  p: ["จากรูป ปุ่ม “ยืนยันคำสั่งซื้อ” เป็นสีเทาอยู่",
                      "น่าจะยังกรอกข้อมูลไม่ครบครับ"] },

    { who: "you", p: ["กรอกครบแล้ว ปุ่มกดได้ปกติ กดแล้วถึงเด้ง error"] },
    { who: "ai",  p: ["งั้นอาจเป็นเรื่องสิทธิ์ของ user ครับ ลองเช็ค role ดู"] },

    { who: "you", p: ["ลูกค้าคนอื่นสร้างได้ปกติ คนนี้คนเดียวที่ไม่ได้"] },
    { who: "ai",  p: ["รบกวนขอ log เต็มๆ กับโค้ดส่วนที่ตรวจ order ได้ไหมครับ"],
      mark: "จุดเปลี่ยน — AI ขอ context เอง" },

    { who: "you", p: ["นี่ครับ"],
      log: "ERROR 00412   order/validate.js:88\n" +
           "if (cust.creditLimit >= order.total)\n" +
           "customer #8842 { creditLimit: null }" },
    { who: "ai",  p: ["เจอแล้วครับ ลูกค้ารายนี้ creditLimit เป็น null",
                      "null เทียบกับตัวเลขได้ false เสมอ โค้ดเลยตีว่าวงเงินไม่พอ ทั้งที่จริงคือยังไม่เคยตั้งวงเงิน"] },

    { who: "you", p: ["แล้วควรแก้ตรงไหนดี"] },
    { who: "ai",  p: ["เฉพาะหน้า: ตั้ง creditLimit ให้ลูกค้ารายนี้ก่อน",
                      "ระยะยาว: แยกเคส null ออกมา แล้วให้ error บอกสาเหตุจริงแทนรหัส 00412 ลอยๆ"] },

    { who: "you", p: ["แก้แล้ว ลูกค้าสร้าง order ได้แล้ว ขอบคุณมากครับ"] },
    { who: "ai",  p: ["ยินดีครับ เคสนี้จะเกิดกับลูกค้าทุกรายที่ยังไม่เคยตั้งวงเงิน",
                      "ลองไล่เช็ครายอื่นด้วยนะครับ"] },

    { who: "you", p: ["🙂👌"], emo: true }
  ];

  var BEATS = MSGS.length;

  /* AUTO — ให้เวลาตามความยาวข้อความ ปิดท้ายยาวหน่อยไว้อ่านบรรทัดสรุป */
  var AUTO_HOLD = [0].concat(MSGS.map(function (m, i) {
    if (i === MSGS.length - 1) return 7000;
    var n = m.p.join("").length + (m.log ? 60 : 0) + (m.shot ? 40 : 0);
    return Math.min(4200, Math.max(1900, 900 + n * 26));
  }));

  var stage  = document.getElementById("stage");
  var feed   = document.getElementById("feed");
  var blink  = document.getElementById("blink");
  var embed  = window.parent !== window;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function fit() {
    stage.style.setProperty("--stage-scale",
      Math.min(window.innerWidth / 1280, window.innerHeight / 720));
  }
  fit();
  window.addEventListener("resize", fit);

  /* ---- สร้าง element ของข้อความ ---- */
  var WARN = '<svg class="warn" viewBox="0 0 13 13" shape-rendering="crispEdges" aria-hidden="true">' +
             '<rect x="5" y="0" width="3" height="2" fill="currentColor"/>' +
             '<rect x="4" y="2" width="5" height="2" fill="currentColor"/>' +
             '<rect x="3" y="4" width="7" height="2" fill="currentColor"/>' +
             '<rect x="2" y="6" width="9" height="2" fill="currentColor"/>' +
             '<rect x="1" y="8" width="11" height="2" fill="currentColor"/>' +
             '<rect x="0" y="10" width="13" height="2" fill="currentColor"/>' +
             '<rect x="6" y="3" width="1" height="5" fill="var(--ground-light)"/>' +
             '<rect x="6" y="9" width="1" height="1" fill="var(--ground-light)"/>' +
             '</svg>';

  /* ---- avatar 13x13 — [x, y, w, h] ทึบล้วน ตา/ปากคือช่องว่างที่ไม่ได้วาด ----
     ไม่มี rect เจาะพื้นหลังเลย เอาไปวางบนพื้นสีอะไรก็ได้
     คน  : หัววงรีเปิด ตาสองจุด ปากขีดเดียว ต่อคอแล้วบานเป็นไหล่
     หุ่น : หัวเหลี่ยม เสาอากาศกลางหัว ตาสี่เหลี่ยม 2x2 ปากเป็นแถบ */
  var AVATARS = {
    human: [[4, 1, 5, 1],                                   /* กระหม่อม */
            [3, 2, 1, 1], [9, 2, 1, 1],                     /* มุมบนโค้งเข้า */
            [2, 3, 1, 3], [10, 3, 1, 3],                    /* แก้มป่องออก */
            [4, 4, 1, 1], [8, 4, 1, 1],                     /* ตา */
            [3, 6, 1, 1], [9, 6, 1, 1],                     /* มุมล่างโค้งเข้า */
            [5, 6, 3, 1],                                   /* ปาก */
            [4, 7, 5, 1],                                   /* คาง */
            [5, 8, 1, 1], [7, 8, 1, 1],                     /* คอ */
            [3, 9, 2, 1], [8, 9, 2, 1],                     /* ไหล่ลาดโค้ง */
            [2, 10, 1, 1], [10, 10, 1, 1],
            [1, 11, 1, 1], [11, 11, 1, 1],
            [1, 12, 11, 1]],                                /* ชายอก */
    robot: [[5, 0, 3, 1], [6, 1, 1, 1],                     /* เสาอากาศ */
            [2, 2, 9, 1], [2, 8, 9, 1],                     /* ขอบหัวบน–ล่าง */
            [2, 3, 1, 5], [10, 3, 1, 5],                    /* ขอบหัวซ้าย–ขวา */
            [4, 4, 2, 2], [7, 4, 2, 2],                     /* ตา */
            [4, 7, 5, 1],                                   /* ปาก */
            [5, 9, 3, 1],                                   /* คอ */
            [1, 10, 11, 1],                                 /* บ่า */
            [1, 11, 1, 1], [11, 11, 1, 1],
            [1, 12, 11, 1]]                                 /* ชายอก */
  };

  function avatar(name) {
    return '<svg class="av av-' + name + '" viewBox="0 0 13 13" ' +
           'shape-rendering="crispEdges" aria-hidden="true">' +
           AVATARS[name].map(function (r) {
             return '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] +
                    '" height="' + r[3] + '" fill="currentColor"/>';
           }).join("") + '</svg>';
  }

  /* แถวชื่อผู้พูด — ฝั่ง AI avatar อยู่ซ้ายของชื่อ ฝั่งเราอยู่ขวา (ชิดขอบนอกเสมอ) */
  function whoRow(who) {
    return '<div class="who">' +
           (who === "ai" ? avatar("robot") + "<span>AI</span>"
                         : "<span>คุณ</span>" + avatar("human")) +
           '</div>';
  }

  var SHOT = '<div class="shot"><div class="top"></div><div class="body">' + WARN +
             '<div class="line" style="width:130px"></div>' +
             '<div class="line" style="width:92px"></div>' +
             '<div class="btn"></div></div></div>';

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function buildMsg(i) {
    var m = MSGS[i];
    var el = document.createElement("div");
    el.className = "msg " + m.who;
    var inner = whoRow(m.who) +
                '<div class="bub">' +
                m.p.map(function (t) { return "<p>" + t + "</p>"; }).join("") +
                '</div>';
    if (m.emo)  el.classList.add("emo");
    if (m.shot) inner += SHOT;
    if (m.log)  inner += '<div class="log">' + esc(m.log) + '</div>';
    if (m.mark) inner += '<div class="mark"><i></i>' + m.mark + '</div>';
    el.innerHTML = '<div class="col">' + inner + '</div>';
    return el;
  }

  /* ---- ตัวบอกว่า AI กำลังพิมพ์ — โผล่เมื่อตาถัดไปเป็นของ AI ---- */
  function clearTyping() {
    var t = feed.querySelector(".typing");
    if (t) t.parentNode.removeChild(t);
  }
  function addTyping() {
    clearTyping();
    if (leaving || beat >= BEATS || MSGS[beat].who !== "ai") return;
    var el = document.createElement("div");
    el.className = "msg ai typing";
    el.innerHTML = '<div class="col">' + whoRow("ai") +
                   '<div class="bub"><div class="dots"><i></i><i></i><i></i></div></div></div>';
    feed.appendChild(el);
  }

  /* ---- beat state ---- */
  var beat = 0, shown = 0, auto = false, leaving = false;
  var timers = [];
  function at(ms, fn) { timers.push(setTimeout(fn, reduce ? 0 : ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function rebuild() {
    clearTyping();
    feed.innerHTML = "";
    for (var i = 0; i < beat; i++) feed.appendChild(buildMsg(i));
    shown = beat;
    addTyping();
  }

  /* ข้อความใหม่เกิดมาพร้อม margin-top ติดลบเท่าความสูงตัวเอง (กองไม่ขยับ)
     แล้ว transition กลับเป็น 0 → ทั้งกองถูกดันขึ้น = การเลื่อนของแชท */
  function push() {
    clearTyping();
    var el = buildMsg(beat - 1);
    feed.appendChild(el);
    var h = el.offsetHeight;
    el.style.marginTop = -h + "px";
    el.style.opacity = "0";
    el.offsetHeight;                                  /* บังคับ reflow ก่อนเปลี่ยนค่า */
    el.style.transition = "margin-top .36s cubic-bezier(.16,1,.3,1), opacity .3s ease-out";
    el.style.marginTop = "0px";
    el.style.opacity = "1";
    shown = beat;
    at(400, addTyping);
  }

  function paint() {
    document.getElementById("count").textContent = beat + "/" + BEATS;
    stage.classList.toggle("is-waiting", beat > 0 && !leaving);
    document.getElementById("btn-prev").disabled = (beat <= 1 && !embed && !PREV);
    document.getElementById("btn-next").disabled = leaving;
  }

  function armAuto() { if (auto && !leaving) at(AUTO_HOLD[beat], advance); }

  function setBeat(n) {
    clearTimers();
    var step = (n === beat + 1);
    beat = n;
    if (step && !reduce) push(); else rebuild();
    paint();
    armAuto();
  }

  function advance() {
    if (leaving) return;
    if (beat < BEATS) setBeat(beat + 1);
    else go("next");
  }

  function back() {
    if (leaving) return;
    if (beat > 1) setBeat(beat - 1);
    else go("prev");
  }

  function reset() {
    clearTimers();
    blink.classList.remove("is-out");
    leaving = false;
    setBeat(0);
    at(60, function () { setBeat(1); });
  }

  function go(dir) {
    if (leaving) return;
    var target = dir === "prev" ? PREV : NEXT;
    if (!embed && !target) return;
    leaving = true;
    clearTimers();
    paint();
    blink.classList.add("is-out");
    setTimeout(function () {
      if (embed) {
        window.parent.postMessage({ type: "slide:" + dir, from: "03-chat" }, "*");
      } else {
        window.location.href = target;
      }
    }, reduce ? 0 : 620);
  }

  /* ---- ปุ่มควบคุม ---- */
  var controls = document.getElementById("controls");
  var btnAuto  = document.getElementById("btn-auto");
  controls.addEventListener("click", function (e) { e.stopPropagation(); });

  document.getElementById("btn-next").addEventListener("click", advance);
  document.getElementById("btn-prev").addEventListener("click", back);
  document.getElementById("btn-reset").addEventListener("click", reset);
  btnAuto.addEventListener("click", function () {
    auto = !auto;
    btnAuto.setAttribute("aria-pressed", auto ? "true" : "false");
    clearTimers();
    armAuto();
  });

  document.addEventListener("click", advance);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight" || e.key === "PageDown") {
      e.preventDefault(); advance();
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault(); back();
    } else if (e.key === "r" || e.key === "R") {
      reset();
    }
  });

  /* ============================================================
     ฉากล่าง — ลูปของตัวเอง ไม่ยุ่งกับ beat เลย
     ใช้ตัวจับเวลาคนละชุด (sceneT) จะได้ไม่โดน clearTimers() ของ beat ล้าง
     ============================================================ */
  /* ทั้งฉาก (ห้องทำงาน→คน) กินพื้นที่ x 328..951 กึ่งกลาง 639.5 = กลางเวทีพอดี
     ขยับค่าไหนต้องเลื่อนทั้งชุดพร้อมกัน ไม่งั้นฉากเบ้ไปข้างใดข้างหนึ่ง */
  var BOT_HOME = 450;                      /* กลางช่องประตูของห้องทำงาน */
  var BOT_TALK = 804;                      /* จุดที่หุ่นเดินมาคุยกับคน */
  var GUY_X    = 904;                      /* คนยืนนิ่ง ขอบขวาสุดของฉาก = 951 */

  var bot    = document.getElementById("bot");
  var guy    = document.getElementById("guy");
  var botSay = document.getElementById("bot-say");
  var guySay = document.getElementById("guy-say");

  /* คำในบอลลูนเป็นสัญลักษณ์ล้วน ตั้งใจให้อ่านไม่ออก — สื่อแค่ว่ากำลังคุยกัน */
  var GUY_LINES = ["▪▪▪", "?", "!", "▪▪", "…", "!?", "▪?"];
  var BOT_LINES = ["0101", "♪", "▪▪▪", "!", "10▪", "…", "✓"];
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  var sceneT = [];
  function sat(ms, fn) { sceneT.push(setTimeout(fn, ms)); }

  function face(pawn, name) {
    var sp = pawn.querySelector(".sprite");
    if (sp.getAttribute("data-char") === name) return;
    sp.setAttribute("data-char", name);
    if (window.Characters) window.Characters.hydrate(pawn);
  }
  function say(el, text, emo) {
    el.textContent = text;
    el.classList.toggle("is-emo", !!emo);
    el.classList.add("is-on");
  }
  function hush(el) { el.classList.remove("is-on"); }

  function move(x, ms) {
    bot.style.setProperty("--walk", ms + "ms");
    bot.offsetHeight;                      /* บังคับ reflow ให้ duration ใหม่มีผลก่อนย้าย */
    bot.style.setProperty("--x", x + "px");
  }

  function scene() {
    var t = 0;
    function step(ms, fn) { t += ms; sat(t, fn); }

    for (var r = 0; r < 3; r++) (function (last) {
      /* คนเรียก */
      step(r === 0 ? 500 : 900, function () {
        face(guy, "human-left");
        say(guySay, pick(GUY_LINES));
      });
      /* หุ่นออกจากห้องเดินมาหา */
      step(800, function () {
        hush(guySay);
        bot.classList.remove("is-hidden");
        face(bot, "robot-right");
        move(BOT_TALK, 2100);
      });
      /* ถึงแล้วเริ่มคุย */
      step(2300, function () { say(botSay, pick(BOT_LINES)); });

      if (!last) {
        step(900, function () { hush(botSay); say(guySay, pick(GUY_LINES)); });
        step(900, function () { hush(guySay); say(botSay, pick(BOT_LINES)); });
        step(900, function () { hush(botSay); });
      } else {
        /* รอบสุดท้าย: ตอบเสร็จ หยุดแป๊บ แล้วคนขึ้น ✅ */
        step(1000, function () { hush(botSay); });
        step(900,  function () { say(guySay, "✅", true); });
        step(1500, function () { hush(guySay); });
      }

      /* หุ่นกลับเข้าห้อง คนหันหน้าตรงรอ */
      step(300, function () {
        face(bot, "robot-left");
        face(guy, "human");
        move(BOT_HOME, 2100);
      });
      step(2100, function () { bot.classList.add("is-hidden"); });
    })(r === 2);

    step(1200, scene);                     /* วนใหม่ไม่รู้จบ */
  }

  guy.style.setProperty("--x", GUY_X + "px");
  bot.style.setProperty("--x", BOT_HOME + "px");

  if (reduce) {
    bot.style.setProperty("--x", BOT_TALK + "px");
    face(bot, "robot-right");
    face(guy, "human-left");
  } else {
    bot.classList.add("is-hidden");
    sat(300, scene);
  }

  paint();
  at(220, function () { setBeat(1); });
})();
</script>
</body>
</html>
