<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระดับ 04 — Agent Harness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%;margin:0;overflow:hidden}
body{display:grid;place-items:center;cursor:pointer;user-select:none}
.stage{position:fixed;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;background:var(--ground);transform:translate(-50%,-50%) scale(var(--stage-scale,1));transform-origin:center}
.stage.is-jump *{transition:none!important;animation:none!important}
.head{z-index:40;position:absolute;top:16px;left:50%;min-width:430px;padding:9px 28px 10px;border:4px solid var(--ink);background:var(--ground-light);box-shadow:inset 0 0 0 3px var(--ground-light),inset 0 0 0 4px var(--ash);transform:translateX(-50%);text-align:center;font-size:27px;font-weight:600;line-height:1.1;white-space:nowrap}
.head .level{margin-right:16px;font-family:var(--font-mono);font-size:13px;letter-spacing:.12em;color:var(--ink-soft);vertical-align:4px}
.maze{position:absolute;left:136px;top:100px;width:1008px;height:504px;background:var(--ground-light);box-shadow:8px 8px 0 var(--sign-light);overflow:visible}
.grid{position:absolute;inset:0}
.wall{position:absolute;z-index:8;background:var(--sign);box-shadow:0 0 0 1px var(--ink-soft)}
.route,.wander{position:absolute;inset:0;width:1008px;height:504px;overflow:visible;pointer-events:none}
.wander path{fill:none;stroke:var(--ash);stroke-width:7;stroke-linecap:square;stroke-linejoin:miter;stroke-dasharray:10 8;opacity:.72}
.route{opacity:0;transition:opacity .25s ease}
.route path{fill:none;stroke-linecap:square;stroke-linejoin:miter}
.route .route-under{stroke:var(--door);stroke-width:14}
.route .route-core{stroke:var(--frame);stroke-width:8;animation:routePulse .8s steps(2,end) infinite}
@keyframes routePulse{50%{opacity:.62}}
.stage[data-beat="6"] .route,.stage[data-beat="7"] .route,.stage[data-beat="8"] .route{opacity:.92}
.entry{position:absolute;left:-68px;bottom:28px;padding:4px 9px 5px;background:var(--frame);border:3px solid var(--ink);font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.08em}
.entry:after{content:"";position:absolute;right:-16px;top:8px;width:15px;height:4px;background:var(--ink)}
.actor{z-index:22;position:absolute;left:0;top:0;width:50px;height:64px;transform:translate(var(--ax),var(--ay));transition:transform .18s linear}
.actor .sprite{position:absolute;left:0;bottom:0;width:50px;height:64px}
.actor .sprite svg{display:block;width:100%;height:100%;image-rendering:pixelated}
.human{z-index:23}
.robot{z-index:24}
.actor.is-hop .sprite{animation:hop .42s ease-out 2}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-7px)}}
.bubble{position:absolute;left:50%;bottom:68px;min-width:68px;max-width:220px;padding:8px 11px 9px;background:var(--ground-light);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--sign-light);transform:translateX(-50%) translateY(6px);font-size:15px;font-weight:500;line-height:1.2;text-align:center;white-space:nowrap;opacity:0;transition:opacity .18s ease,transform .25s cubic-bezier(.16,1,.3,1)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-9px;width:10px;height:10px;background:var(--ground-light);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.is-on{opacity:1;transform:translateX(-50%) translateY(0)}
.human .bubble{left:0;transform:translateX(-12%) translateY(6px)}
.human .bubble.is-on{transform:translateX(-12%) translateY(0)}
.thought{font-family:var(--font-mono);letter-spacing:.16em}
.order-content{display:flex;align-items:center;gap:9px}
.mini-chest{position:relative;width:25px;height:21px;flex:0 0 auto}
.mini-chest:before{content:"";position:absolute;left:3px;top:1px;width:19px;height:9px;box-sizing:border-box;background:var(--frame);border:3px solid var(--ink)}
.mini-chest:after{content:"";position:absolute;left:1px;bottom:0;width:23px;height:13px;box-sizing:border-box;background:var(--door);border:3px solid var(--ink)}
.chest{z-index:18;position:absolute;width:52px;height:45px;transform:translate(-50%,-50%);filter:drop-shadow(4px 4px 0 var(--sign-light))}
.chest .lid{position:absolute;z-index:3;left:4px;top:1px;width:44px;height:18px;box-sizing:border-box;background:var(--frame);border:4px solid var(--ink);transform-origin:left bottom;transition:transform .42s cubic-bezier(.16,1,.3,1)}
.chest .box{position:absolute;z-index:2;left:0;bottom:0;width:52px;height:31px;box-sizing:border-box;background:var(--door);border:4px solid var(--ink)}
.chest .lock{position:absolute;z-index:4;left:21px;top:18px;width:10px;height:12px;background:var(--frame);border:3px solid var(--ink)}
.chest.is-shake{animation:chestShake .52s steps(2,end)}
@keyframes chestShake{20%,60%{transform:translate(-50%,-50%) translateX(-4px) rotate(-2deg)}40%,80%{transform:translate(-50%,-50%) translateX(4px) rotate(2deg)}}
.chest.is-open .lid{transform:translateY(-10px) rotate(-30deg)}
.chest.is-open .lock{opacity:0}
.spark{position:absolute;z-index:1;left:23px;top:16px;width:6px;height:6px;background:var(--frame);border:2px solid var(--door);opacity:0}
.chest.is-burst .spark{animation:sparkOut .72s steps(4,end) both}
.chest.is-burst .s1{--sx:-30px;--sy:-28px}.chest.is-burst .s2{--sx:0px;--sy:-40px;animation-delay:.08s}.chest.is-burst .s3{--sx:31px;--sy:-25px;animation-delay:.16s}.chest.is-burst .s4{--sx:36px;--sy:2px;animation-delay:.24s}
@keyframes sparkOut{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(1.25)}}
.gem{display:none;position:absolute;z-index:30;left:12px;top:-8px;width:10px;height:10px;background:var(--frame);border:3px solid var(--ink);transform:rotate(45deg);filter:drop-shadow(2px 2px 0 var(--accent))}
.robot.has-gem .gem{display:block}
.marker{z-index:17;position:absolute;left:0;top:0;transform:translate(-50%,-720px);opacity:0;pointer-events:none}
.marker .board{display:grid;place-items:center;width:94px;min-height:68px;box-sizing:border-box;padding:5px 6px 6px;background:var(--ground-light);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--sign-light);text-align:center}
.marker .emoji{font-size:29px;line-height:31px}
.marker .label{font-family:var(--font-body);font-size:15px;font-weight:600;line-height:18px}
.marker .post{width:4px;height:13px;margin:auto;background:var(--ink)}
.marker.is-on{opacity:1;transform:translate(-50%,-50%)}
.marker.is-on.is-dropping{animation:markerFall .78s cubic-bezier(.18,.78,.26,1.08) both}
@keyframes markerFall{0%{opacity:0;transform:translate(-50%,-720px) rotate(-2deg)}68%{opacity:1;transform:translate(-50%,-42%) rotate(2deg)}82%{transform:translate(-50%,-58%) rotate(-2deg)}92%{transform:translate(-50%,-47%) rotate(1deg)}100%{opacity:1;transform:translate(-50%,-50%) rotate(0)}}
.marker.is-pulse .board{animation:pulse .48s steps(2,end) 3}
@keyframes pulse{50%{background:var(--frame);transform:translateY(-5px) rotate(-1deg)}}
.mission{z-index:26;position:absolute;left:14px;bottom:154px;width:116px;height:96px;box-sizing:border-box;padding:8px;background:var(--ground-light);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--sign-light);opacity:0;transform:translate(-92px,116px) scale(.56) rotate(-4deg);transform-origin:left bottom;transition:opacity .2s ease,transform .5s cubic-bezier(.16,1,.3,1)}
.mission .mission-title{padding-bottom:5px;border-bottom:3px solid var(--ink);font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.12em}
.mission svg{display:block;width:100%;height:60px;margin-top:5px}.mission .map-wall{fill:none;stroke:var(--ash);stroke-width:5}.mission .map-route{fill:none;stroke:var(--door);stroke-width:5}.mission .map-dot{fill:var(--frame);stroke:var(--ink);stroke-width:2}
.stage[data-beat="5"] .mission,.stage[data-beat="6"] .mission,.stage[data-beat="7"] .mission,.stage[data-beat="8"] .mission{opacity:1;transform:translateY(0) scale(1) rotate(-2deg)}
.stage[data-beat="6"] .mission{transform:translateY(-10px) scale(.68) rotate(-2deg);opacity:.4}
.stage[data-beat="7"] .mission,.stage[data-beat="8"] .mission{transform:translateY(-20px) scale(.56) rotate(-2deg);opacity:0}
.signal{z-index:20;position:absolute;inset:0;width:1280px;height:720px;pointer-events:none;opacity:0}
.signal path{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:8 7}
.signal.is-on{opacity:.62;animation:signalBlink .7s steps(2,end) 3}
@keyframes signalBlink{50%{opacity:.18}}
.cap{position:absolute;left:90px;right:90px;top:655px;text-align:center;font-size:16px;line-height:1.25}
.wait{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-family:var(--font-mono);font-size:14px;opacity:0}
.stage.is-waiting .wait{opacity:.58;animation:wait 1.1s steps(1,end) infinite}
@keyframes wait{50%{opacity:.12}}
.controls{z-index:60;position:absolute;right:20px;bottom:12px;display:flex;gap:10px;align-items:center;font-family:var(--font-mono);font-size:11px;opacity:.28}
.controls:hover{opacity:.9}.controls button{appearance:none;border:0;padding:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer}.controls button:disabled{opacity:.25}.controls .count{min-width:29px;text-align:center}.controls [aria-pressed="true"]{text-decoration:underline}
.blink{position:fixed;inset:0;pointer-events:none;background:var(--ground);opacity:0;transition:opacity .62s ease}.blink.is-out{opacity:1}
@media(prefers-reduced-motion:reduce){.actor,.bubble,.route,.marker,.mission,.chest .lid,.blink{transition:none!important}.actor.is-hop .sprite,.marker,.marker.is-pulse .board,.route .route-core,.chest,.chest .spark,.signal.is-on,.stage.is-waiting .wait{animation:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage" data-beat="0">
  <div class="head"><span class="level">ระดับ 04</span><span id="titleText">Agent Harness</span></div>
  <main class="maze" id="maze">
    <div class="grid" id="grid"></div>
    <svg class="wander" viewBox="0 0 1008 504" aria-hidden="true"><path id="wanderPath"></path></svg>
    <svg class="route" viewBox="0 0 1008 504" aria-hidden="true"><path class="route-under" id="routeUnder"></path><path class="route-core" id="routePath"></path></svg>
    <div id="markers"></div>
    <div class="entry">START</div>
    <div class="mission"><div class="mission-title">HARNESS</div><svg viewBox="0 0 104 60" aria-hidden="true"><path class="map-wall" d="M4 9H38V25H69V10H100M4 50H28V35H53V51H100"/><path class="map-route" d="M8 45H20V30H45V18H75V42H96"/><circle class="map-dot" cx="8" cy="45" r="4"/><circle class="map-dot" cx="96" cy="42" r="4"/></svg></div>
    <div class="chest" id="chest"><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="lid"></i><i class="box"></i><i class="lock"></i></div>
  </main>
  <div class="actor human" id="human"><div class="sprite"></div><div class="bubble" id="humanBubble"></div></div>
  <div class="actor robot" id="robot"><div class="sprite"></div><i class="gem"></i><div class="bubble thought" id="robotBubble"></div></div>
  <svg class="signal" id="signal" viewBox="0 0 1280 720"><path id="signalPath"></path></svg>
  <div class="cap" id="cap"></div>
  <div class="wait">&#9660;</div>
  <div class="controls" id="controls"><button id="btn-prev">&#9664;</button><button id="btn-next">&#9654;</button><div class="count" id="count">0/8</div><button id="btn-reset">&#8635;</button><button id="btn-auto" aria-pressed="false">AUTO</button></div>
</div>
<div class="blink" id="blink"></div>
<script src="../../assets/characters/characters.js"></script>
<script>
(function(){
"use strict";
var NEXT="",PREV="07-agent.html",BEATS=8;
var AUTO_HOLD=[0,2800,2800,3400,3000,3200,4000,4600,7600];
var COLS=12,ROWS=6,CELL=84,MAZE_X=136,MAZE_Y=100;
var start={x:0,y:5},goal={x:11,y:0};
var stage=document.getElementById("stage"),gridEl=document.getElementById("grid");
var human=document.getElementById("human"),robot=document.getElementById("robot");
var humanBubble=document.getElementById("humanBubble"),robotBubble=document.getElementById("robotBubble");
var routePath=document.getElementById("routePath"),routeUnder=document.getElementById("routeUnder"),wanderPath=document.getElementById("wanderPath");
var chest=document.getElementById("chest"),signal=document.getElementById("signal");
var signalPath=document.getElementById("signalPath"),cap=document.getElementById("cap");
var blink=document.getElementById("blink"),embed=window.parent!==window;
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var beat=0,auto=false,leaving=false,timers=[],routeLength=0,markerEls=[];
var CAPS=[
  "",
  "งานเดียว เป้าหมายเดียว",
  "หุ่นรู้เป้าหมาย แล้วเริ่มหาทางเอง",
  "ทุกทางแยกต้องลองและจำเอง",
  "มีเป้าหมาย แต่ไม่มีระบบพาไปจนจบ",
  "คนเพิ่มวิธีทำงาน โดยใช้หุ่นตัวเดิม",
  "Harness วาง Context, Tools และจุดตรวจไว้ตามทาง",
  "หุ่นเดินตามผลที่พบ และกลับมาหาคนเมื่อจำเป็น",
  "งานจบเมื่อผ่านการตรวจ ไม่ใช่แค่ไปถึงปลายทาง"
];

function fit(){stage.style.setProperty("--stage-scale",Math.min(innerWidth/1280,innerHeight/720))}
fit();addEventListener("resize",fit);
function at(ms,fn){timers.push(setTimeout(fn,reduce?0:ms))}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function key(c){return c.x+","+c.y}
function same(a,b){return a.x===b.x&&a.y===b.y}

/* deterministic cell maze: square corridors, thin muted walls, stable on every load */
var maze=Array.from({length:ROWS},function(){return Array.from({length:COLS},function(){
  return{visited:false,walls:[true,true,true,true]};
})});
var seed=40721;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function shuffled(list){
  list=list.slice();
  for(var i=list.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1)),t=list[i];list[i]=list[j];list[j]=t}
  return list;
}
var DIRS=[
  {dx:0,dy:-1,wall:0,opp:2},
  {dx:1,dy:0,wall:1,opp:3},
  {dx:0,dy:1,wall:2,opp:0},
  {dx:-1,dy:0,wall:3,opp:1}
];
function carve(x,y){
  maze[y][x].visited=true;
  shuffled(DIRS).forEach(function(d){
    var nx=x+d.dx,ny=y+d.dy;
    if(nx<0||nx>=COLS||ny<0||ny>=ROWS||maze[ny][nx].visited)return;
    maze[y][x].walls[d.wall]=false;maze[ny][nx].walls[d.opp]=false;carve(nx,ny);
  });
}
carve(start.x,start.y);
maze[start.y][start.x].walls[3]=false;

function addWall(x,y,w,h){
  var wall=document.createElement("i");wall.className="wall";
  wall.style.left=x+"px";wall.style.top=y+"px";wall.style.width=w+"px";wall.style.height=h+"px";
  gridEl.appendChild(wall);
}
maze.forEach(function(row,y){
  row.forEach(function(cell,x){
    if(cell.walls[0])addWall(x*CELL-3,y*CELL-3,CELL+6,6);
    if(cell.walls[3])addWall(x*CELL-3,y*CELL-3,6,CELL+6);
    if(y===ROWS-1&&cell.walls[2])addWall(x*CELL-3,(y+1)*CELL-3,CELL+6,6);
    if(x===COLS-1&&cell.walls[1])addWall((x+1)*CELL-3,y*CELL-3,6,CELL+6);
  });
});

function openNeighbors(c){
  return DIRS.filter(function(d){return !maze[c.y][c.x].walls[d.wall]})
    .map(function(d){return{x:c.x+d.dx,y:c.y+d.dy}})
    .filter(function(n){return n.x>=0&&n.x<COLS&&n.y>=0&&n.y<ROWS});
}
function solve(from,to){
  var q=[from],seen=new Set([key(from)]),prev={};
  while(q.length){
    var c=q.shift();
    if(same(c,to))break;
    openNeighbors(c).forEach(function(n){
      if(seen.has(key(n)))return;
      seen.add(key(n));prev[key(n)]=c;q.push(n);
    });
  }
  var path=[],cur=to;
  while(cur){path.push(cur);if(same(cur,from))break;cur=prev[key(cur)]}
  return path.reverse();
}
var solution=solve(start,goal);

function findWrongTurn(path){
  var onPath=new Set(path.map(key));
  for(var i=3;i<Math.min(path.length-3,Math.floor(path.length*.58));i++){
    var branch=openNeighbors(path[i]).filter(function(n){return !onPath.has(key(n))});
    if(!branch.length)continue;
    var result=[path[i]],prev=path[i],cur=branch[0],guard=0;
    result.push(cur);
    while(guard++<14){
      var opts=openNeighbors(cur).filter(function(n){return !same(n,prev)});
      if(!opts.length)break;
      var next=opts[0];prev=cur;cur=next;result.push(cur);
    }
    if(result.length>=3)return{index:i,prefix:path.slice(0,i+1),wrong:result};
  }
  return{index:Math.min(8,path.length-2),prefix:path.slice(0,Math.min(9,path.length)),wrong:path.slice(Math.min(8,path.length-2),Math.min(14,path.length))};
}
var detour=findWrongTurn(solution);
var wrongFull=detour.prefix.concat(detour.wrong.slice(1));

function localPoint(c){return{x:c.x*CELL+CELL/2,y:c.y*CELL+CELL/2}}
function stagePoint(c){var p=localPoint(c);return{x:MAZE_X+p.x,y:MAZE_Y+p.y}}
function pathD(cells){
  return cells.map(function(c,i){var p=localPoint(c);return(i?"L":"M")+p.x+" "+p.y}).join(" ");
}
routePath.setAttribute("d",pathD(solution));
routeUnder.setAttribute("d",pathD(solution));
wanderPath.setAttribute("d","");
routeLength=routePath.getTotalLength();
routePath.style.strokeDasharray=routeLength;
routePath.style.strokeDashoffset=routeLength;
routeUnder.style.strokeDasharray=routeLength;
routeUnder.style.strokeDashoffset=routeLength;

var markerDefs=[
  {emoji:"📖",label:"Context",ratio:.18},
  {emoji:"🔧",label:"Tool",ratio:.36},
  {emoji:"🔀",label:"Decision",ratio:.53},
  {emoji:"👤",label:"Human",ratio:.70},
  {emoji:"✅",label:"Verify",ratio:.88}
];
var markerHost=document.getElementById("markers");
markerDefs.forEach(function(def){
  def.index=Math.min(solution.length-2,Math.max(1,Math.round((solution.length-1)*def.ratio)));
  def.cell=solution[def.index];
  var p=localPoint(def.cell),el=document.createElement("div");
  el.className="marker";el.style.left=p.x+"px";el.style.top=Math.max(52,p.y)+"px";
  el.innerHTML='<div class="board"><div class="emoji">'+def.emoji+'</div><div class="label">'+def.label+'</div></div><div class="post"></div>';
  markerHost.appendChild(el);markerEls.push(el);
});
var humanIndex=markerDefs[3].index,verifyIndex=markerDefs[4].index;

var gp=localPoint(goal);
chest.style.left=gp.x+"px";chest.style.top=gp.y+"px";
var humanStage={x:76,y:stagePoint(start).y-8};

function pose(el,name){
  var svg=window.Characters&&window.Characters.svg[name];
  if(svg)el.querySelector(".sprite").innerHTML=svg;
}
function placeActor(el,p,immediate,duration){
  if(immediate){el.style.transition="none"}
  else{el.style.transition="transform "+Math.max(12,duration||170)+"ms linear"}
  el.style.setProperty("--ax",(p.x-25)+"px");
  el.style.setProperty("--ay",(p.y-58)+"px");
  if(immediate){void el.offsetWidth;el.style.transition=""}
}
function placeRobot(c,immediate,duration,previous){
  if(previous){
    if(c.x<previous.x)pose(robot,"robot-left");
    else if(c.x>previous.x)pose(robot,"robot-right");
  }
  placeActor(robot,stagePoint(c),immediate,duration);
}
placeActor(human,humanStage,true);placeRobot(start,true);pose(human,"human-right");pose(robot,"robot-right");

function hideBubbles(){
  humanBubble.classList.remove("is-on");robotBubble.classList.remove("is-on");
}
function bubble(el,text){
  el.textContent=text;el.classList.add("is-on");
}
function orderBubble(){
  humanBubble.innerHTML='<div class="order-content"><span>ไปเอากล่องนี้มาให้หน่อย</span><i class="mini-chest"></i></div>';
  humanBubble.classList.add("is-on");
}
function setWander(cells){wanderPath.setAttribute("d",cells&&cells.length?pathD(cells):"")}
function setRoute(progress,animate){
  var offset=routeLength*(1-Math.max(0,Math.min(1,progress)));
  [routeUnder,routePath].forEach(function(path){
    path.style.transition=animate&&!reduce?"stroke-dashoffset .42s cubic-bezier(.16,1,.3,1)":"none";
    path.style.strokeDashoffset=offset;
  });
}
function markerState(show){
  markerEls.forEach(function(el){el.classList.toggle("is-on",show);el.classList.remove("is-pulse","is-dropping")});
}
function pulseMarker(index){
  var best=0,diff=Infinity;
  markerDefs.forEach(function(def,i){var d=Math.abs(def.index-index);if(d<diff){diff=d;best=i}});
  var el=markerEls[best];el.classList.remove("is-pulse");void el.offsetWidth;el.classList.add("is-pulse");
}
function movePath(cells,total,onStep,done){
  if(cells.length<2){if(done)done();return}
  var step=Math.max(12,total/(cells.length-1)),i=1,prev=cells[0];
  function move(){
    var current=cells[i];
    placeRobot(current,false,step*.84,prev);
    if(onStep)onStep(current,i);
    prev=current;i++;
    if(i<cells.length)at(step,move);
    else at(step,done||function(){});
  }
  move();
}

function paintText(n){
  document.getElementById("titleText").textContent=n>0&&n<5?"ยังไม่มี Harness":"Agent Harness";
  cap.textContent=CAPS[n]||"";
  document.getElementById("count").textContent=n+"/"+BEATS;
  stage.classList.toggle("is-waiting",n>0&&!leaving);
  document.getElementById("btn-next").disabled=leaving||(!embed&&!NEXT&&n===BEATS);
}

function settledBubbles(n){
  hideBubbles();
  if(n===1)orderBubble();
  if(n===2)bubble(robotBubble,"รับทราบ");
  if(n===3)bubble(robotBubble,"...?");
  if(n===4)bubble(robotBubble,"ขอข้อมูลเพิ่ม");
  if(n===5){bubble(humanBubble,"ใช้ชุดนี้");bubble(robotBubble,"🫡👌")}
  if(n===7){bubble(humanBubble,"อนุมัติ");bubble(robotBubble,"🫡")}
  if(n===8){bubble(humanBubble,"เรียบร้อย");bubble(robotBubble,"👌")}
}

function renderState(n){
  stage.classList.add("is-jump");stage.dataset.beat=n;
  signal.classList.remove("is-on");chest.classList.remove("is-shake","is-burst");chest.classList.toggle("is-open",n>=8);
  robot.classList.toggle("has-gem",n>=8);markerState(n>=6);
  setWander(n===2?detour.prefix:(n===3||n===4?wrongFull:[]));
  setRoute(n<6?0:n===6?.18:n===7?humanIndex/(solution.length-1):1,false);
  var cell=n===2?detour.prefix[detour.prefix.length-1]:n===3?wrongFull[wrongFull.length-1]:n===7?solution[humanIndex]:start;
  placeActor(human,humanStage,true);placeRobot(cell,true);pose(human,"human-right");pose(robot,n===3||n===4?"robot-left":"robot-right");
  settledBubbles(n);paintText(n);void stage.offsetWidth;stage.classList.remove("is-jump");
}

function done(){
  stage.classList.add("is-waiting");
  if(auto&&!leaving)at(AUTO_HOLD[beat],advance);
}

function runBeat(n){
  stage.dataset.beat=n;paintText(n);stage.classList.remove("is-waiting");hideBubbles();
  if(n===1){
    at(220,orderBubble);at(1150,done);
  }else if(n===2){
    bubble(robotBubble,"รับทราบ");
    var visited=[detour.prefix[0]];
    movePath(detour.prefix,2100,function(c){visited.push(c);setWander(visited)},done);
  }else if(n===3){
    bubble(robotBubble,"...?");
    var trail=detour.prefix.slice();
    at(500,function(){
      movePath(detour.wrong,2600,function(c){trail.push(c);setWander(trail)},function(){
        robot.classList.add("is-hop");at(850,function(){robot.classList.remove("is-hop");done()});
      });
    });
  }else if(n===4){
    var backPath=detour.wrong.slice().reverse().concat(detour.prefix.slice(0,-1).reverse());
    movePath(backPath,2300,null,function(){pose(robot,"robot-left");bubble(robotBubble,"ขอข้อมูลเพิ่ม");done()});
  }else if(n===5){
    bubble(humanBubble,"ใช้ชุดนี้");
    at(650,function(){bubble(robotBubble,"🫡👌");robot.classList.add("is-hop")});
    at(1550,function(){robot.classList.remove("is-hop");done()});
  }else if(n===6){
    setRoute(.18,true);
    markerEls.forEach(function(el,i){at(320+i*250,function(){
      el.classList.add("is-on","is-dropping");
      at(820,function(){el.classList.remove("is-dropping")});
    })});
    at(1950,done);
  }else if(n===7){
    var toHuman=solution.slice(0,humanIndex+1);
    movePath(toHuman,3600,function(c,i){
      setRoute(i/(solution.length-1),true);
      markerDefs.forEach(function(def){if(def.index===i)pulseMarker(i)});
    },function(){
      var rp=stagePoint(solution[humanIndex]);
      signalPath.setAttribute("d","M"+(humanStage.x+20)+" "+(humanStage.y+8)+" L"+rp.x+" "+rp.y);
      signal.classList.add("is-on");bubble(robotBubble,"🫡");at(500,function(){bubble(humanBubble,"อนุมัติ")});at(1650,done);
    });
  }else if(n===8){
    var rest=solution.slice(humanIndex);
    movePath(rest,2700,function(c,i){
      var absolute=humanIndex+i;setRoute(absolute/(solution.length-1),true);
      if(absolute===verifyIndex)pulseMarker(absolute);
    },function(){
      chest.classList.add("is-shake");robot.classList.add("is-hop");
      at(520,function(){chest.classList.remove("is-shake");chest.classList.add("is-open","is-burst")});
      at(900,function(){robot.classList.remove("is-hop");robot.classList.add("has-gem")});
      at(1320,function(){
        movePath(solution.slice().reverse(),3000,null,function(){
          pose(robot,"robot-left");bubble(robotBubble,"👌");bubble(humanBubble,"เรียบร้อย");done();
        });
      });
    });
  }
}

function setBeat(n){
  clearTimers();
  var forward=n===beat+1&&!reduce;
  if(forward){
    renderState(n-1);beat=n;requestAnimationFrame(function(){runBeat(n)});
  }else{beat=n;renderState(n);done()}
}
function advance(){if(leaving)return;if(beat<BEATS)setBeat(beat+1);else go("next")}
function back(){if(leaving)return;if(beat>1)setBeat(beat-1);else go("prev")}
function reset(){clearTimers();blink.classList.remove("is-out");leaving=false;beat=0;renderState(0);at(80,function(){setBeat(1)})}
function go(dir){
  if(leaving)return;
  var target=dir==="prev"?PREV:NEXT;
  if(!embed&&!target)return;
  leaving=true;clearTimers();paintText(beat);blink.classList.add("is-out");
  setTimeout(function(){
    if(embed)parent.postMessage({type:"slide:"+dir,from:"08-agent"},"*");
    else location.href=target;
  },reduce?0:620);
}
var controls=document.getElementById("controls"),autoBtn=document.getElementById("btn-auto");
controls.addEventListener("click",function(e){e.stopPropagation()});
document.getElementById("btn-next").onclick=advance;
document.getElementById("btn-prev").onclick=back;
document.getElementById("btn-reset").onclick=reset;
autoBtn.onclick=function(){auto=!auto;autoBtn.setAttribute("aria-pressed",auto?"true":"false");clearTimers();if(auto)at(AUTO_HOLD[beat],advance)};
document.addEventListener("click",advance);
document.addEventListener("keydown",function(e){
  if(["Enter"," ","ArrowRight","PageDown"].indexOf(e.key)>=0){e.preventDefault();advance()}
  else if(["ArrowLeft","PageUp"].indexOf(e.key)>=0){e.preventDefault();back()}
  else if(e.key==="r"||e.key==="R")reset();
});
renderState(0);at(220,function(){setBeat(1)});
})();
</script>
</body>
