<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Harness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%;margin:0;overflow:hidden}
body{display:grid;place-items:center;cursor:pointer;user-select:none}
.stage{position:fixed;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;background:var(--ground);transform:translate(-50%,-50%) scale(var(--stage-scale,1));transform-origin:center}
.stage.is-jump *{transition:none!important;animation:none!important}

.title-frame{position:absolute;z-index:40;left:50%;top:44px;min-width:520px;padding:20px 64px 22px;background:var(--ground-light);border:5px solid var(--ink);box-shadow:inset 0 0 0 3px var(--ground-light),inset 0 0 0 5px var(--ash);text-align:center;opacity:0;transform:translateX(-50%) translateZ(0);backface-visibility:hidden;isolation:isolate;will-change:transform}
.title-frame h1{margin:0;font-size:48px;font-weight:600;line-height:1.12;letter-spacing:.06em;text-transform:uppercase}
.stage:not([data-beat="0"]) .title-frame{opacity:1}
.stage[data-beat="1"].is-entering .title-frame{animation:frameDrop .75s cubic-bezier(.16,1,.3,1) .1s both}
@keyframes frameDrop{from{opacity:0;transform:translate3d(-50%,-220px,0)}to{opacity:1;transform:translate3d(-50%,0,0)}}

.floor{position:absolute;z-index:5;left:0;right:0;bottom:28px;height:3px;background:var(--ash);opacity:.5}
.actor{position:absolute;z-index:22;top:492px;width:157px;height:200px;opacity:0;transition:left .9s cubic-bezier(.16,1,.3,1),top .9s cubic-bezier(.16,1,.3,1),opacity .25s ease}
.actor .sprite,.actor .sprite svg{display:block;width:100%;height:100%;image-rendering:pixelated}
.human{left:214px}.robot{left:909px}
.stage:not([data-beat="0"]) .actor{opacity:1}
.stage[data-beat="2"] .human{left:392px}.stage[data-beat="2"] .robot{left:750px}
.stage[data-beat="3"] .human,.stage[data-beat="4"] .human,.stage[data-beat="5"] .human{left:116px}
.stage[data-beat="3"] .robot,.stage[data-beat="4"] .robot,.stage[data-beat="5"] .robot{left:562px;top:452px}
.human.is-walking .sprite{animation:walkBob .34s steps(2,end) 4}
.robot.is-charging .sprite{animation:chargeBob .25s steps(2,end) 6}
.robot.is-ready .sprite{animation:greetHop .42s ease-out 2}
@keyframes walkBob{50%{transform:translateY(-7px)}}
@keyframes chargeBob{50%{transform:translateY(-5px)}}
@keyframes greetHop{40%{transform:translateY(-16px)}}

.module{position:absolute;z-index:16;width:132px;height:94px;opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .35s steps(3,end)}
.module-card{display:grid;place-items:center;width:100%;height:100%;box-sizing:border-box;padding:7px 8px 8px;background:var(--ground-light);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--sign-light)}
.module .emoji{font-size:39px;line-height:42px}.module .label{font-size:19px;font-weight:600;line-height:22px;text-align:center}
.m-context{left:112px;top:196px;--dx:462px;--dy:277px;--mx:185px;--my:72px;--turn:18deg;--delay:0ms}
.m-tool{left:1034px;top:206px;--dx:-460px;--dy:267px;--mx:-190px;--my:72px;--turn:-18deg;--delay:100ms}
.m-decision{left:574px;top:214px;--dx:0px;--dy:259px;--mx:40px;--my:88px;--turn:14deg;--delay:200ms}
.m-human{left:132px;top:372px;--dx:442px;--dy:101px;--mx:180px;--my:-14px;--turn:-16deg;--delay:300ms}
.m-verify{left:1022px;top:386px;--dx:-448px;--dy:87px;--mx:-180px;--my:-18px;--turn:16deg;--delay:400ms}
.stage:not([data-beat="0"]) .module{opacity:1;transform:translateY(0)}
.stage[data-beat="4"] .module,.stage[data-beat="5"] .module{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.08)}
.stage.is-sucking .module{animation:moduleSuck 1.55s cubic-bezier(.7,.02,.85,.3) var(--delay) both}
.stage.is-sucking .module-card{animation:cardDissolve 1.12s steps(5,end) var(--delay) both}
.stage.is-sucking .module .label{animation:labelDissolve .58s steps(3,end) var(--delay) both}
.stage.is-sucking .module .emoji{animation:emojiShrink 1.45s steps(7,end) var(--delay) both}
@keyframes moduleSuck{0%{opacity:1;transform:translate(0,0) scale(1)}58%{opacity:1;transform:translate(var(--mx),var(--my)) scale(.62) rotate(var(--turn))}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.08) rotate(0)}}
@keyframes cardDissolve{0%,28%{background:var(--ground-light);border-color:var(--ink);box-shadow:5px 5px 0 var(--sign-light)}100%{background:transparent;border-color:transparent;box-shadow:none}}
@keyframes labelDissolve{0%,30%{opacity:1}100%{opacity:0}}
@keyframes emojiShrink{0%,32%{font-size:39px}100%{font-size:21px}}

.energy{position:absolute;z-index:11;left:545px;top:421px;width:190px;height:190px;opacity:0;transform:scale(.18);transition:opacity .3s ease,transform .9s cubic-bezier(.16,1,.3,1)}
.stage[data-beat="2"] .energy{opacity:1;transform:scale(.42)}
.stage[data-beat="3"] .energy,.stage[data-beat="4"] .energy{opacity:1;transform:scale(1)}
.stage[data-beat="5"] .energy{opacity:.62;transform:scale(.88)}
.energy .ring{position:absolute;left:50%;top:50%;box-sizing:border-box;border:8px solid var(--frame);border-radius:50%;opacity:.22;filter:blur(5px) drop-shadow(0 0 7px var(--frame))}
.energy .r1{width:174px;height:174px;margin:-87px}.energy .r2{width:126px;height:126px;margin:-63px;border-color:var(--door);opacity:.16;animation-delay:-.45s!important}.energy .r3{width:78px;height:78px;margin:-39px;border-width:5px;opacity:.3;animation-delay:-.8s!important}
.energy .core{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;background:var(--frame);border:4px solid var(--ink);transform:rotate(45deg);box-shadow:0 0 0 8px var(--ground-light),0 0 0 13px var(--frame)}
.energy .spark{position:absolute;width:8px;height:8px;background:var(--frame);border:3px solid var(--door);opacity:0}
.energy .s1{left:15px;top:83px}.energy .s2{right:19px;top:41px}.energy .s3{left:77px;top:4px}.energy .s4{right:29px;bottom:19px}.energy .s5{left:30px;bottom:25px}
.stage[data-beat="2"] .energy .ring,.stage[data-beat="3"] .energy .ring,.stage[data-beat="4"] .energy .ring,.stage[data-beat="5"] .energy .ring{animation:ringPulse 1.35s ease-in-out infinite}
.stage[data-beat="3"] .energy .core,.stage[data-beat="4"] .energy .core{animation:coreCharge .52s steps(3,end) infinite}
.stage[data-beat="2"] .energy .spark,.stage[data-beat="3"] .energy .spark,.stage[data-beat="4"] .energy .spark,.stage[data-beat="5"] .energy .spark{animation:sparkPulse 1s steps(2,end) infinite}
.energy .s2{animation-delay:.2s!important}.energy .s3{animation-delay:.4s!important}.energy .s4{animation-delay:.6s!important}.energy .s5{animation-delay:.8s!important}
@keyframes ringPulse{50%{opacity:.42;transform:scale(1.08)}}
@keyframes coreCharge{50%{transform:rotate(45deg) scale(1.35);filter:brightness(1.2)}}
@keyframes sparkPulse{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.1)}}

.light-field{position:absolute;z-index:8;inset:0;width:1280px;height:720px;pointer-events:none;opacity:0;transition:opacity .28s ease}
.stage.is-sucking .light-field,.stage[data-beat="5"] .light-field{opacity:1}
.orbit-halo{fill:none;stroke:var(--frame);opacity:0}
.orbit-halo.outer{stroke-width:42;filter:blur(18px)}
.orbit-halo.inner{stroke-width:9;filter:blur(5px)}
.stage[data-beat="5"] .orbit-halo.outer{opacity:.2;animation:haloOuter 1.7s ease-in-out infinite}
.stage[data-beat="5"] .orbit-halo.inner{opacity:.38;animation:haloInner 1.7s ease-in-out infinite}
@keyframes haloOuter{50%{opacity:.3;stroke-width:50}}
@keyframes haloInner{50%{opacity:.56;stroke-width:12}}
.trail{fill:none;stroke-linecap:round;stroke-linejoin:round}
.trail.outer{stroke:var(--frame);stroke-width:32;opacity:.22;filter:blur(12px)}
.trail.mid{stroke:var(--frame);stroke-width:14;opacity:.44;filter:blur(5px)}
.trail.core{stroke:var(--ground-light);stroke-width:3;opacity:.96;filter:drop-shadow(0 0 6px var(--frame))}
.orbit-icon{position:absolute;z-index:9;left:0;top:0;width:58px;height:58px;display:grid;place-items:center;font-size:39px;line-height:1;opacity:0;filter:drop-shadow(3px 3px 0 var(--sign-light));pointer-events:none}
.stage[data-beat="5"] .orbit-icon{opacity:1}

.charge-burst{position:absolute;z-index:27;left:530px;top:410px;width:220px;height:220px;opacity:0;pointer-events:none}
.charge-burst i{position:absolute;left:50%;top:50%;width:9px;height:9px;background:var(--frame);border:3px solid var(--door)}
.charge-burst .b1{--bx:-118px;--by:-62px}.charge-burst .b2{--bx:112px;--by:-75px}.charge-burst .b3{--bx:125px;--by:52px}.charge-burst .b4{--bx:-110px;--by:76px}.charge-burst .b5{--bx:0px;--by:-125px}.charge-burst .b6{--bx:4px;--by:122px}
.stage[data-beat="3"].is-entering .charge-burst{opacity:1}.stage[data-beat="3"].is-entering .charge-burst i{animation:burstOut .9s steps(5,end) both}
@keyframes burstOut{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(1.25)}}

.wait{position:absolute;z-index:50;left:50%;bottom:6px;transform:translateX(-50%);font-family:var(--font-mono);font-size:14px;opacity:0}
.stage.is-waiting .wait{opacity:.55;animation:wait 1.1s steps(1,end) infinite}
@keyframes wait{50%{opacity:.12}}
.controls{position:absolute;z-index:60;right:16px;bottom:8px;display:flex;align-items:center;gap:2px}
.controls button{padding:7px 9px;background:none;border:0;color:var(--ink);font-family:var(--font-mono);font-weight:600;font-size:13px;letter-spacing:.08em;line-height:1;cursor:pointer;opacity:.28}.controls button:hover,.controls button:focus-visible{opacity:.95;outline:none}.controls button[aria-pressed="true"]{opacity:.95;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}.controls button:disabled{opacity:.1;cursor:default}
.pips{display:flex;gap:4px;padding:0 7px;opacity:.28}.controls:hover .pips{opacity:.95}.pip{width:7px;height:7px;border:2px solid var(--ink);background:transparent}.pip.is-done{background:var(--ink)}
.blink{position:fixed;z-index:99;inset:0;pointer-events:none;background:var(--ink);opacity:0}.blink.is-out{animation:doorBlink .62s steps(1,end) forwards}
@keyframes doorBlink{0%{opacity:0}14%{opacity:1}28%{opacity:0}42%{opacity:1}56%{opacity:0}70%{opacity:1}100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.title-frame,.actor,.module,.energy,.light-field{transition:none!important}.title-frame,.human .sprite,.robot .sprite,.module,.module-card,.module .label,.module .emoji,.energy .ring,.energy .core,.energy .spark,.orbit-halo,.charge-burst i,.stage.is-waiting .wait,.blink{animation:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage" data-beat="0">
  <div class="floor"></div>

  <div class="module m-context"><div class="module-card"><div class="emoji">📖</div><div class="label">Context</div></div></div>
  <div class="module m-tool"><div class="module-card"><div class="emoji">🔧</div><div class="label">Tool</div></div></div>
  <div class="module m-decision"><div class="module-card"><div class="emoji">🔀</div><div class="label">Decision</div></div></div>
  <div class="module m-human"><div class="module-card"><div class="emoji">👤</div><div class="label">Human</div></div></div>
  <div class="module m-verify"><div class="module-card"><div class="emoji">✅</div><div class="label">Verify</div></div></div>

  <svg class="light-field" viewBox="0 0 1280 720" aria-hidden="true">
    <ellipse class="orbit-halo outer" cx="640" cy="500" rx="290" ry="132"></ellipse>
    <ellipse class="orbit-halo inner" cx="640" cy="500" rx="290" ry="132"></ellipse>
    <g id="trailLayer"></g>
  </svg>
  <div class="orbit-icon">📖</div><div class="orbit-icon">🔧</div><div class="orbit-icon">🔀</div><div class="orbit-icon">👤</div><div class="orbit-icon">✅</div>

  <div class="energy" aria-hidden="true">
    <i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i><i class="core"></i>
    <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i>
  </div>
  <div class="charge-burst" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i><i class="b6"></i></div>

  <div class="actor human" id="human"><div class="sprite"></div></div>
  <div class="actor robot" id="robot"><div class="sprite"></div></div>

  <div class="title-frame"><h1>Agent Harness</h1></div>
  <div class="wait">&#9660;</div>
  <div class="controls" id="controls"><button id="btn-prev">&#9664;</button><button id="btn-next">&#9654;</button><div class="pips" id="pips"></div><button id="btn-reset">&#8635;</button><button id="btn-auto" aria-pressed="false">AUTO</button></div>
</div>
<div class="blink" id="blink"></div>
<script src="../../assets/characters/characters.js"></script>
<script>
(function(){
"use strict";
var NEXT="08-agent.html",PREV="06-context-files.html",BEATS=5,AUTO_HOLD=[0,2800,3000,3200,3400,5000];
var stage=document.getElementById("stage"),human=document.getElementById("human"),robot=document.getElementById("robot");
var blink=document.getElementById("blink"),moduleEls=[].slice.call(document.querySelectorAll(".module")),orbitEls=[].slice.call(document.querySelectorAll(".orbit-icon"));
var trailLayer=document.getElementById("trailLayer"),trailSets=[],trailHistory=[[],[],[],[],[]];
var embed=window.parent!==window,reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var beat=0,auto=false,leaving=false,timers=[],orbitFrame=0,suctionFrame=0,orbitStart=0;
function fit(){stage.style.setProperty("--stage-scale",Math.min(innerWidth/1280,innerHeight/720))}
fit();addEventListener("resize",fit);
function at(ms,fn){timers.push(setTimeout(fn,reduce?0:ms))}
function clearTimers(){timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(orbitFrame);cancelAnimationFrame(suctionFrame)}
function pose(el,name){var svg=window.Characters&&window.Characters.svg[name];if(svg)el.querySelector(".sprite").innerHTML=svg}
pose(human,"human-right");pose(robot,"robot-left");
var pipsEl=document.getElementById("pips"),pips=[];
for(var i=0;i<BEATS;i++){var p=document.createElement("span");p.className="pip";pipsEl.appendChild(p);pips.push(p)}
var SVG_NS="http://www.w3.org/2000/svg";
moduleEls.forEach(function(){
  var set={};
  ["outer","mid","core"].forEach(function(kind){var p=document.createElementNS(SVG_NS,"path");p.setAttribute("class","trail "+kind);trailLayer.appendChild(p);set[kind]=p});
  trailSets.push(set);
});
function localCenter(el){
  var sr=stage.getBoundingClientRect(),r=el.getBoundingClientRect(),scale=sr.width/1280;
  return{x:(r.left-sr.left+r.width/2)/scale,y:(r.top-sr.top+r.height/2)/scale};
}
function trailPath(points){
  if(points.length<2)return"";
  var d="M"+points[0].x.toFixed(1)+" "+points[0].y.toFixed(1);
  for(var i=1;i<points.length;i++){var a=points[i-1],b=points[i],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;d+=" Q"+a.x.toFixed(1)+" "+a.y.toFixed(1)+" "+mx.toFixed(1)+" "+my.toFixed(1)}
  var last=points[points.length-1];return d+" L"+last.x.toFixed(1)+" "+last.y.toFixed(1);
}
function paintTrail(index,points){var d=trailPath(points),set=trailSets[index];set.outer.setAttribute("d",d);set.mid.setAttribute("d",d);set.core.setAttribute("d",d)}
function clearTrails(){trailHistory=[[],[],[],[],[]];trailSets.forEach(function(set){set.outer.setAttribute("d","");set.mid.setAttribute("d","");set.core.setAttribute("d","")})}
function addTrailPoint(index,point,limit){
  var h=trailHistory[index],last=h[h.length-1];
  if(!last||Math.hypot(point.x-last.x,point.y-last.y)>.7)h.push(point);
  if(h.length>limit)h.splice(0,h.length-limit);
  paintTrail(index,h);
}
function suctionTrails(){
  if(beat!==4||!stage.classList.contains("is-sucking"))return;
  moduleEls.forEach(function(el,i){addTrailPoint(i,localCenter(el),38)});
  suctionFrame=requestAnimationFrame(suctionTrails);
}
function orbit(now){
  if(beat!==5)return;
  if(!orbitStart)orbitStart=now;
  var elapsed=now-orbitStart,spread=reduce?1:Math.min(1,elapsed/1050),theta=reduce?0:elapsed*.00048;
  orbitEls.forEach(function(el,i){
    var a=theta+i*Math.PI*2/orbitEls.length,depth=Math.sin(a);
    var x=640+Math.cos(a)*290*spread,y=500+Math.sin(a)*132*spread;
    var scale=.72+(depth+1)*.1;
    el.style.transform="translate(-50%,-50%) translate("+x+"px,"+y+"px) scale("+scale+")";
    el.style.zIndex=depth>0?29:9;
    addTrailPoint(i,{x:x,y:y},70);
  });
  orbitFrame=requestAnimationFrame(orbit);
}
function paint(n){
  stage.dataset.beat=n;
  pips.forEach(function(p,idx){p.classList.toggle("is-done",idx<n)});
  stage.classList.toggle("is-waiting",n>0&&!leaving);
  document.getElementById("btn-next").disabled=leaving;
}
function renderState(n){
  stage.classList.add("is-jump");stage.classList.remove("is-entering","is-sucking");
  human.classList.remove("is-walking");robot.classList.remove("is-charging","is-ready");
  orbitStart=0;clearTrails();beat=n;paint(n);
  if(n===5){orbitStart=performance.now()-1100;orbitFrame=requestAnimationFrame(orbit)}
  void stage.offsetWidth;stage.classList.remove("is-jump");
}
function done(){stage.classList.remove("is-entering","is-sucking");stage.classList.add("is-waiting");if(auto&&!leaving)at(AUTO_HOLD[beat],advance)}
function run(n){
  stage.classList.add("is-entering");paint(n);stage.classList.remove("is-waiting");
  if(n===1)at(1050,done);
  else if(n===2){human.classList.add("is-walking");at(1500,function(){human.classList.remove("is-walking");done()})}
  else if(n===3){robot.classList.add("is-charging");at(1750,function(){robot.classList.remove("is-charging");done()})}
  else if(n===4){stage.classList.add("is-sucking");clearTrails();suctionFrame=requestAnimationFrame(suctionTrails);robot.classList.add("is-charging");at(2250,function(){robot.classList.remove("is-charging");done()})}
  else if(n===5){clearTrails();orbitStart=0;orbitFrame=requestAnimationFrame(orbit);at(1150,function(){robot.classList.add("is-ready")});at(2200,function(){robot.classList.remove("is-ready");done()})}
}
function setBeat(n){
  clearTimers();
  var forward=n===beat+1&&!reduce;
  if(forward){renderState(n-1);beat=n;requestAnimationFrame(function(){run(n)})}
  else{renderState(n);done()}
}
function advance(){if(leaving)return;if(beat<BEATS)setBeat(beat+1);else go("next")}
function back(){if(leaving)return;if(beat>1)setBeat(beat-1);else go("prev")}
function reset(){clearTimers();blink.classList.remove("is-out");leaving=false;renderState(0);at(80,function(){setBeat(1)})}
function go(dir){
  if(leaving)return;var target=dir==="prev"?PREV:NEXT;if(!embed&&!target)return;
  leaving=true;clearTimers();paint(beat);blink.classList.add("is-out");
  setTimeout(function(){if(embed)parent.postMessage({type:"slide:"+dir,from:"07-agent"},"*");else location.href=target},reduce?0:620);
}
var controls=document.getElementById("controls"),autoBtn=document.getElementById("btn-auto");
controls.addEventListener("click",function(e){e.stopPropagation()});
document.getElementById("btn-next").onclick=advance;document.getElementById("btn-prev").onclick=back;document.getElementById("btn-reset").onclick=reset;
autoBtn.onclick=function(){auto=!auto;autoBtn.setAttribute("aria-pressed",auto?"true":"false");clearTimers();if(beat===5){orbitStart=performance.now()-1100;orbitFrame=requestAnimationFrame(orbit)}if(auto)at(AUTO_HOLD[beat],advance)};
document.addEventListener("click",advance);
document.addEventListener("keydown",function(e){if(["Enter"," ","ArrowRight","PageDown"].indexOf(e.key)>=0){e.preventDefault();advance()}else if(["ArrowLeft","PageUp"].indexOf(e.key)>=0){e.preventDefault();back()}else if(e.key==="r"||e.key==="R")reset()});
renderState(0);at(220,function(){setBeat(1)});
})();
</script>
</body>
</html>
