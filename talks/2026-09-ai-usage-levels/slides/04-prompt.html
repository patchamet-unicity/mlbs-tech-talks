<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระดับ 02 — Prompt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
/* ============================================================
   สไลด์ 4 — "ระดับ 02 Prompt"

   ต่อจากสไลด์ 3 โดยตรง: เอาบทสนทนา 17 ข้อความอันเดิมมาแปลงเป็น
   ข้อความเดียวที่ส่งครั้งเดียวแล้วได้ root cause เลย

   ใจความ: ข้อมูลใน 17 ข้อความนั้น "อยู่ในหัวคุณตั้งแต่ข้อความแรกแล้ว"
   ยกเว้น log อันเดียว — พรอมต์ที่ดีไม่ใช่การเดาถูก แต่คือการส่งของที่มีอยู่ให้ครบ

   ทำไมปลายทางถึงเป็น "ฟองแชท" ไม่ใช่การ์ดแบบฟอร์ม (ตัดสินใจ 2026-08-30):
   ถ้าปลายทางเป็นช่องให้กรอกมีป้ายกำกับ มันจะกลายเป็นภาษาภาพของ "เทมเพลต/โครงสร้าง"
   ซึ่งเป็นของสไลด์ 5 (context engineer) ระดับ 02 ต้องเป็นแค่
   "คุณพิมพ์ข้อความเดียวให้ครบ" — ของที่ใครก็พิมพ์ได้ ไม่มีเครื่องมืออะไรช่วย
   ป้ายกำกับเลยกลายเป็นคำนำหน้าบรรทัดในตัวข้อความเอง (เช็คไปแล้วดังนี้ครับ)

   6 beat (หนึ่งบีตหนึ่งความคิด ไม่ตีกัน)
     1  บทสนทนาเต็ม 17 แถวฝั่งซ้าย + หน้าต่างแชทเปล่าฝั่งขวา
     2  ซิป  — แถวฝั่ง AI จางแล้วยุบความสูงเป็น 0 กองรูดปิดเข้าหากัน
     3  FLIP — 7 แถวที่เหลือบินเข้าไปประกอบเป็นฟองใบเดียวทีละชิ้น
     4  ส่งแล้ว — AI ขึ้นจุดสามจุด กองแชทเลื่อนขึ้น
     5  คำตอบมาในฟองถัดไป หน้าต่างนี้มีอยู่ 2 ฟอง (เทียบ 17 ฟองของสไลด์ 3)
     6  สรุป 17 → 2 + บรรทัดที่ยอมรับว่ารอบแรกยังไม่รู้ว่าต้องแนบ log

   ทำไมต้องบินเป็น "ผี" (clone ใน .fly) แทนการย้ายแถวจริง:
   แถวจริงอยู่ใน .rows ที่ overflow:hidden ย้ายออกไม่ได้ และปลายทางขนาดไม่เท่าต้นทาง
   ถ้า scale ตัวหนังสือจะยืด → ใช้ translate อย่างเดียวแล้ว cross-fade ให้ปลายทางโผล่แทน
   ฟองปลายทางต้องถูกวาง "เต็มใบแต่เนื้อในล่องหน" ตั้งแต่ต้น beat 3
   ไม่งั้นชิ้นที่บินทีหลังจะวัดตำแหน่งไม่ตรง เพราะฟองยังโตไม่เสร็จ

   y 556..720 เว้นไว้ให้ฉากหุ่น + คน (ยังไม่ทำ) — ห้ามเอาเนื้อหาลงไปกิน

   --accent ใช้จุดเดียว = เลข 2 ในบรรทัดสรุป beat 6
   ============================================================ */

html, body { height: 100%; overflow: hidden; }
body {
  display: grid;
  place-items: center;
  cursor: pointer;
  user-select: none;
}

.stage {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 1280px;
  height: 720px;
  transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
  transform-origin: center center;
  overflow: hidden;
  background: var(--ground);
}

/* ตอน rebuild (ถอยหลัง / รีเซ็ต) ต้องไม่มีอนิเมชันหลงเหลือ */
.stage.is-jump *, .stage.is-jump *::before, .stage.is-jump *::after {
  transition: none !important;
  animation: none !important;
}

/* ---- หัวสไลด์ ---- */
.head {
  position: absolute;
  left: 50%;
  top: 22px;
  transform: translateX(-50%);
  padding: 10px 36px;
  background: var(--ground-light);
  border: 4px solid var(--ink);
  box-shadow: inset 0 0 0 3px var(--ground-light), inset 0 0 0 4px var(--ash);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 28px;
  letter-spacing: .02em;
  line-height: 1.2;
  color: var(--ink);
  white-space: nowrap;
}

/* ============================================================
   กล่องสองใบ y 96..492 — ซ้าย x 60..520 / ขวา x 560..1220
   ขอบนอกเท่ากันสองข้าง (60) ช่องกลาง 40
   ฝั่งขวากว้างกว่าเพราะต้องอุ้มฟองข้อความยาว + ของแนบ
   ============================================================ */
.pane {
  position: absolute;
  top: 96px;
  height: 396px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  background: var(--ground-light);
  border: 4px solid var(--ink);
}
.pane .bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 9px;
  height: 30px;
  padding: 0 12px;
  box-sizing: border-box;
  background: var(--sign);
  border-bottom: 4px solid var(--ink);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 15px;
  color: var(--ink);
}
.pane .bar b {
  width: 9px;
  height: 9px;
  background: var(--ink);
  opacity: .55;
}
.pane .bar .n {
  margin-left: auto;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .06em;
  opacity: .7;
}

/* ---- ซ้าย: บทสนทนาย่อจากสไลด์ 3 ---- */
.pane-chat {
  left: 60px;
  width: 460px;
  transition: opacity .45s ease-out;
}
.pane-chat.is-gone { opacity: 0; }

/* จัดกลางแนวตั้ง — พอแถว AI ยุบหาย แถวที่เหลือจะไหลมารวมกลางเอง */
.rows {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 7px 10px;
  box-sizing: border-box;
  overflow: hidden;
}

/* 17 แถว x 20px = 339 พอดีในช่องสูง 352 — เปลี่ยนขนาดตัวอักษรต้องคำนวณใหม่ */
.row {
  flex: 0 0 auto;
  align-self: flex-start;
  max-width: 95%;
  height: 19px;
  margin-top: 1px;
  padding: 0 8px;
  box-sizing: border-box;
  border: 2px solid var(--ink);
  background: var(--ground-light);
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 11.5px;
  line-height: 15px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row:first-child { margin-top: 0; }
.row.you {
  align-self: flex-end;
  background: var(--frame);
}

/* ============================================================
   ขวา: หน้าต่างแชท — กลไกเดียวกับสไลด์ 3 เป๊ะ
   กองจากล่างขึ้นบน ล้นแล้วโดนตัด + ไล่จางที่ขอบบน
   ============================================================ */
/* beat 4 กล่องซ้ายหายไปแล้ว เลื่อนหน้าต่างมากลางเวที ((1280-660)/2 = 310)
   ย้ายด้วย transform อย่างเดียว ความกว้างไม่เปลี่ยน ฟองข้างในเลยไม่ต้อง reflow */
.pane-send {
  left: 560px;
  width: 660px;
  transition: transform .6s cubic-bezier(.5, 0, .2, 1);
}
.pane-send.is-mid { transform: translateX(-250px); }

.viewport {
  position: relative;
  flex: 1 1 auto;
  overflow: hidden;
  /* ไล่จางสั้นๆ พอบอกว่ามีของอยู่เหนือขึ้นไป — ยาวกว่านี้แล้วหัวฟองพรอมต์ของ
     beat 3 จะโดนกลืน ทั้งที่ตอนนั้นยังไม่มีอะไรเลื่อนขึ้นไปจริงๆ */
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 26px);
          mask-image: linear-gradient(to bottom, transparent 0, #000 26px);
}
.feed {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px 16px;
  box-sizing: border-box;
}

.msg { display: flex; padding-top: 12px; }
.msg:first-child { padding-top: 0; }
.msg.you { justify-content: flex-end; }
.msg .col { display: flex; flex-direction: column; width: 100%; }
.msg.ai .col { width: auto; max-width: 90%; }
.msg.you .col { align-items: flex-end; }

.who {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  padding: 0 2px;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .16em;
  color: var(--ink-soft);
}
/* avatar ชุดเดียวกับสไลด์ 3 — ตา/ปากคือช่องว่างที่ไม่ได้วาด วางบนพื้นสีอะไรก็ได้ */
.av {
  flex: 0 0 auto;
  display: block;
  width: 20px;
  height: 20px;
  color: var(--ink-soft);
  opacity: .85;
}

.bub {
  box-sizing: border-box;
  width: 100%;
  padding: 9px 14px 11px;
  border: 3px solid var(--ink);
  background: var(--ground-light);
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--ink);
}
.msg.you .bub { background: var(--frame); }
.msg.ai .bub { width: auto; font-size: 15px; }
.bub p { margin: 0; }
.bub p + p { margin-top: 6px; }
.bub b { font-weight: 500; }

/* ---- ชิ้นส่วนของฟอง — ล่องหนไว้ก่อน ให้ของที่บินมาลงเป็นตัวเปิด ---- */
.pc {
  opacity: 0;
  transition: opacity .32s ease-out .28s;
}
.pc.is-on { opacity: 1; }

.lead { font-weight: 400; }
.bub ul {
  margin: 4px 0 0;
  padding: 0;
  list-style: none;
}
.bub li {
  position: relative;
  padding-left: 15px;
}
.bub li::before {
  content: "";
  position: absolute;
  left: 3px;
  top: 9px;
  width: 5px;
  height: 5px;
  background: var(--ink);
  opacity: .55;
}

/* ---- ของแนบ: รูปหน้าจอ + log วางคู่กัน ---- */
.att {
  display: flex;
  align-items: stretch;
  gap: 10px;
  margin-top: 7px;
}
.shot {
  flex: 0 0 auto;
  width: 116px;
  background: var(--ground-light);
  border: 3px solid var(--ink);
}
.shot .top { height: 12px; background: var(--sign); border-bottom: 3px solid var(--ink); }
.shot .body {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 8px 10px 9px;
}
.warn { display: block; width: 24px; height: 24px; color: var(--ink); }
.shot .line { height: 5px; background: var(--ink-soft); opacity: .45; }
.shot .btn { width: 62px; height: 14px; background: var(--ash); }

.log {
  flex: 1 1 auto;
  padding: 8px 11px;
  box-sizing: border-box;
  background: var(--ground);
  border: 3px solid var(--ink);
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: 11.5px;
  line-height: 1.65;
  color: var(--ink);
  white-space: pre;
  overflow: hidden;
}

.ask { margin-top: 7px; }
.bub .fix {
  margin-top: 7px;
  padding-left: 11px;
  border-left: 3px solid var(--ash);
  font-size: 14px;
}

/* micro loop: AI กำลังพิมพ์ */
.dots { display: flex; align-items: center; gap: 7px; height: 23px; }
.dots i {
  width: 8px;
  height: 8px;
  background: var(--ink-soft);
  opacity: .3;
  animation: dotPulse 1.5s steps(1, end) infinite;
}
.dots i:nth-child(2) { animation-delay: .3s; }
.dots i:nth-child(3) { animation-delay: .6s; }
@keyframes dotPulse { 0%, 60% { opacity: .85 } 61%, 100% { opacity: .25 } }

/* ---- ชั้นบินของ "ผี" — ไม่โดน overflow ของกล่องไหนตัด ---- */
.fly {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}
.fly .row { position: absolute; left: 0; top: 0; margin-top: 0; max-width: none; }

/* ---- บรรทัดคำบรรยาย y 500..556 (beat 6 สองบรรทัด = สูงสุด 56px พอดีขอบฉาก) ---- */
.cap {
  position: absolute;
  left: 60px;
  right: 60px;
  top: 500px;
  text-align: center;
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 20px;
  line-height: 1.3;
  color: var(--ink-soft);
}
.cap .sub {
  display: block;
  margin-top: 3px;
  font-weight: 300;
  font-size: 15px;
  opacity: .85;
}
.cap .big {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 26px;
  color: var(--ink);
}
.cap .big.hit { color: var(--accent); }

/* ============================================================
   ฉากล่าง y 556..720 (สูง 164 — เตี้ยกว่าสไลด์ 3 อยู่ 16px
   ค่าแนวตั้งเลยถูกดันขึ้นจาก 30 เป็น 18 ทั้งชุด ส่วนค่าแนวนอนใช้ของสไลด์ 3 เป๊ะ)

   วนไม่รู้จบ ไม่ผูกกับ beat — รอบเดียวจบ ต่างจากสไลด์ 3 ที่วิ่ง 3 รอบ
   คนเรียก → หุ่นออกจากตู้ → คน "พิมพ์" ข้อความยาวให้ดูทีละบรรทัด
   → หุ่นรับแล้วกลับเข้าตู้ไปทำ → ออกมาตอบ ถูกตั้งแต่ครั้งแรก → คนขึ้น ✅
   ============================================================ */
.scene {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 164px;
}
.scene .floor {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 18px;
  height: 3px;
  background: var(--ash);
  opacity: .5;
}

/* ---- ตู้ rack (ชุดเดียวกับสไลด์ 3) ----
   ตู้อยู่ z-index สูงกว่าตัวละคร หุ่นเลย "เลื่อนหายเข้าไปหลังตู้" จริงๆ */
.rack {
  position: absolute;
  left: 342px;
  bottom: 18px;
  width: 86px;
  height: 120px;
  box-sizing: border-box;
  background: var(--ground-light);
  border: 4px solid var(--ink);
  overflow: hidden;
  z-index: 2;
}
.rack .cap {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  height: 16px;
  padding-right: 7px;
  background: var(--sign);
  border-bottom: 4px solid var(--ink);
}
.rack .cap i { width: 5px; height: 5px; background: var(--ink); opacity: .45; }

.bays { padding: 7px 7px 0; }
.bay {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 16px;
  margin-bottom: 5px;
  padding: 0 5px;
  box-sizing: border-box;
  background: var(--ground);
  border: 2px solid var(--ink);
}
.bay .led {
  width: 5px;
  height: 5px;
  background: var(--grass-deep);
  opacity: .35;
  animation: ledIdle 3.4s steps(1, end) infinite;
}
.bay:nth-child(2) .led { animation-delay: .9s; }
.bay:nth-child(3) .led { animation-delay: 1.8s; }
.bay:nth-child(4) .led { animation-delay: 2.5s; }
.bay .vent { flex: 1; height: 4px; background: var(--ink); opacity: .22; }
@keyframes ledIdle { 0%, 12% { opacity: 1 } 13%, 100% { opacity: .3 } }

/* หุ่นเข้าไปทำงานในตู้ — ไฟกะพริบถี่ + แถบสแกนไล่ลงมา */
.rack.is-busy .bay .led { animation: ledBusy .48s steps(1, end) infinite; }
.rack.is-busy .bay:nth-child(2) .led { animation-delay: .12s; }
.rack.is-busy .bay:nth-child(3) .led { animation-delay: .3s; }
.rack.is-busy .bay:nth-child(4) .led { animation-delay: .2s; }
@keyframes ledBusy { 0%, 49% { opacity: 1 } 50%, 100% { opacity: .25 } }

.rack .scan {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 4px;
  background: var(--grass-deep);
  opacity: 0;
}
.rack.is-busy .scan { animation: rackScan 1.5s linear infinite; }
@keyframes rackScan {
  0%   { transform: translateY(16px); opacity: 0 }
  12%  { opacity: .75 }
  88%  { opacity: .75 }
  100% { transform: translateY(112px); opacity: 0 }
}

/* ---- ตัวละคร 30% ของสไลด์ 1 (ชุดเดียวกับสไลด์ 3) ---- */
.pawn {
  position: absolute;
  z-index: 1;
  --char-size: 60px;
  bottom: 18px;
  left: 0;
  transform: translateX(var(--x, 0));
  opacity: 1;
  transition: opacity .22s linear;
}
.pawn .char { height: var(--char-size); }
.pawn.is-hidden { opacity: 0; }
.pawn-bot { transition: transform var(--walk, 2s) linear, opacity .22s linear; }

/* ---- บอลลูนเหนือหัว ---- */
.say {
  position: absolute;
  left: 50%;
  bottom: calc(var(--char-size) + 9px);
  transform: translateX(-50%) scale(.7);
  padding: 4px 10px 5px;
  background: var(--ground-light);
  border: 3px solid var(--ink);
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 14px;
  line-height: 1.2;
  color: var(--ink);
  white-space: nowrap;
  opacity: 0;
  transition: opacity .16s ease-out, transform .16s cubic-bezier(.16, 1, .3, 1);
}
.say::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -12px;
  margin-left: -5px;
  width: 9px;
  height: 9px;
  background: var(--ground-light);
  border-right: 3px solid var(--ink);
  border-bottom: 3px solid var(--ink);
}
.say.is-on { opacity: 1; transform: translateX(-50%) scale(1); }
.say.is-emo { font-family: var(--font-body); font-size: 19px; padding: 2px 10px 4px; }

/* ---- โหมด "กำลังพิมพ์" ของฝั่งคน ----
   กล่องกำหนดขนาดเป็น px ผ่าน --sw/--sh ที่คำนวณจากตาราง SK ใน JS (ไม่ได้วัดจาก DOM)
   เพราะ width:auto ทรานซิชันไม่ได้ และตอนคำนวณแท่งยังกว้างไม่เสร็จ
   สูงสุด ~71px พอดีช่องว่างเหนือหัวคนในฉากสูง 164 — เพิ่มบรรทัดต้องวัดใหม่ */
.say.is-sk {
  box-sizing: border-box;                /* --sw/--sh รวม padding+border มาแล้ว */
  width: var(--sw, 22px);
  height: var(--sh, 16px);
  padding: 5px 7px;
  overflow: hidden;
  transition: width .3s cubic-bezier(.16, 1, .3, 1),
              height .3s cubic-bezier(.16, 1, .3, 1),
              opacity .16s ease-out,
              transform .16s cubic-bezier(.16, 1, .3, 1);
}
.sk { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.sk .bl { display: flex; align-items: center; gap: 5px; }
.sk .bar {
  display: block;
  width: 0;
  height: 4px;
  background: var(--ink);
  opacity: .5;
  transition: width .26s ease-out;
}
.sk .dot { display: block; width: 4px; height: 4px; background: var(--ink); opacity: .5; }
.sk .im {
  position: relative;
  width: 0;
  height: 14px;
  box-sizing: border-box;
  border: 2px solid var(--ink);
  opacity: .5;
  overflow: hidden;
  transition: width .26s ease-out;
}
.sk .im::after {
  content: "";
  position: absolute;
  left: 3px;
  top: 3px;
  width: 4px;
  height: 4px;
  background: var(--ink);
}

/* ---- ตัวบอกว่ารอคลิก ---- */
.wait {
  position: absolute;
  left: 50%;
  bottom: 11px;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 17px;
  color: var(--ink);
  opacity: 0;
}
.stage.is-waiting .wait {
  animation: waitIn .3s ease-out both, waitBlink 1.25s steps(1, end) .3s infinite;
}
@keyframes waitIn    { from { opacity: 0 } to { opacity: 1 } }
@keyframes waitBlink { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }

/* ---- ปุ่มควบคุม มุมล่างขวา (ชุดเดียวกับสไลด์ 1–3) ---- */
.controls {
  position: absolute;
  right: 16px;
  bottom: 8px;
  display: flex;
  align-items: center;
  gap: 2px;
  z-index: 5;
}
.controls button {
  padding: 7px 9px;
  background: none;
  border: 0;
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .08em;
  line-height: 1;
  cursor: pointer;
  opacity: .28;
  transition: opacity .15s;
}
.controls button:hover,
.controls button:focus-visible { opacity: .95; outline: none; }
.controls button[aria-pressed="true"] {
  opacity: .95;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-thickness: 2px;
}
.controls button:disabled { opacity: .1; cursor: default; }

.count {
  padding: 0 7px;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .08em;
  color: var(--ink);
  opacity: .28;
  transition: opacity .15s;
}
.controls:hover .count { opacity: .95; }

/* ---- exit ---- */
.blink {
  position: fixed;
  inset: 0;
  background: var(--ink);
  opacity: 0;
  pointer-events: none;
  z-index: 99;
}
.blink.is-out { animation: doorBlink .62s steps(1, end) forwards; }
@keyframes doorBlink {
  0% { opacity: 0 } 14% { opacity: 1 } 28% { opacity: 0 }
  42% { opacity: 1 } 56% { opacity: 0 } 70% { opacity: 1 } 100% { opacity: 1 }
}

@media (prefers-reduced-motion: reduce) {
  .pane, .pane-send, .row, .pc, .msg, .fly .row { transition: none !important; }
  .dots i { animation: none; }
  .pawn, .pawn-bot, .say, .sk .bar, .sk .im { transition: none; }
  .bay .led, .rack .scan { animation: none; }
  .stage.is-waiting .wait { animation: none; opacity: 1; }
  .blink.is-out { animation: none; opacity: 1; }
}

         translate อย่างเดียว ไม่ scale (ขนาดไม่เท่ากัน ถ้า scale ตัวหนังสือจะยืด) ---- */
  function flyOne(row, ids, delay) {
    var dests = ids.map(function (id) { return document.getElementById("p-" + id); })
                   .filter(Boolean);
    var a = box(row), b = box(dests[0]);
    var g = row.cloneNode(true);
    g.style.width = a.w + "px";
    g.style.transform = "translate(" + a.x + "px," + a.y + "px)";
    flyEl.appendChild(g);
    row.style.visibility = "hidden";        /* ซ่อนแบบไม่ให้กองขยับระหว่างบิน */

    at(delay, function () {
      g.style.transition = "transform .6s cubic-bezier(.5,0,.2,1), " +
                           "opacity .26s ease-in .34s";
      g.style.transform = "translate(" + b.x + "px," + b.y + "px)";
      g.style.opacity = "0";
      dests.forEach(function (d) { d.classList.add("is-on"); });
    });
    at(delay + 700, function () { if (g.parentNode) g.parentNode.removeChild(g); });
  }

  /* ฟองต้องถูกวางเต็มใบก่อน (เนื้อในล่องหน) ไม่งั้นชิ้นที่บินทีหลังวัดตำแหน่งไม่ตรง */
  function fly() {
    feed.innerHTML = "";
    feed.appendChild(msgEl("you", PROMPT));
    showPieces(false);
    sendN.textContent = "1 ข้อความ";

    var d = 260;
    [].slice.call(rowsEl.querySelectorAll(".row.you")).forEach(function (row) {
      var r = ROWS[+row.getAttribute("data-i")];
      if (!r.to) return;
      flyOne(row, r.to, d);
      d += 150;
    });
    /* สองแถวที่ไม่มีปลายทาง (ขอบคุณ + อิโมจิ) — ไม่ใช่ข้อมูล เลยจางไปเฉยๆ */
    at(d + 120, function () {
      [].slice.call(rowsEl.querySelectorAll(".row.you")).forEach(function (row) {
        if (ROWS[+row.getAttribute("data-i")].to) return;
        row.style.transition = "opacity .3s linear";
        row.style.opacity = "0";
      });
    });
    at(d + 520, function () { chat.classList.add("is-gone"); });
  }

  /* ---- ข้อความใหม่ดันกองขึ้น: เกิดมาพร้อม margin-top ติดลบเท่าความสูงตัวเอง
         แล้ว transition กลับเป็น 0 (กลไกเดียวกับสไลด์ 3) ---- */
  function push(el) {
    feed.appendChild(el);
    var h = el.offsetHeight;
    el.style.marginTop = -h + "px";
    el.style.opacity = "0";
    el.offsetHeight;                        /* บังคับ reflow ก่อนเปลี่ยนค่า */
    el.style.transition = "margin-top .4s cubic-bezier(.16,1,.3,1), opacity .3s ease-out";
    el.style.marginTop = "0px";
    el.style.opacity = "1";
  }

  var STEP = {
    2: zip,
    3: fly,
    4: function () {
      sendEl.classList.add("is-mid");
      at(260, function () {
        push(msgEl("ai", '<div class="dots"><i></i><i></i><i></i></div>'));
      });
    },
    5: function () {
      var t = feed.querySelector(".msg.ai");
      if (t) t.parentNode.removeChild(t);
      push(msgEl("ai", ANSWER));
      sendN.textContent = "2 ข้อความ";
    }
  };

  function paint() {
    document.getElementById("count").textContent = beat + "/" + BEATS;
    capEl.innerHTML = CAPS[beat] || "";
    stage.classList.toggle("is-waiting", beat > 0 && !leaving);
    document.getElementById("btn-prev").disabled = (beat <= 1 && !embed && !PREV);
    document.getElementById("btn-next").disabled = leaving;
  }

  function armAuto() { if (auto && !leaving) at(AUTO_HOLD[beat], advance); }

  function setBeat(n) {
    clearTimers();
    var step = (n === beat + 1) && STEP[n] && !reduce;
    beat = n;
    if (step) STEP[n](); else rebuild(n);
    paint();
    armAuto();
  }

  function advance() {
    if (leaving) return;
    if (beat < BEATS) setBeat(beat + 1);
    else go("next");
  }

  function back() {
    if (leaving) return;
    if (beat > 1) setBeat(beat - 1);
    else go("prev");
  }

  function reset() {
    clearTimers();
    blink.classList.remove("is-out");
    leaving = false;
    setBeat(0);
    at(60, function () { setBeat(1); });
  }

  function go(dir) {
    if (leaving) return;
    var target = dir === "prev" ? PREV : NEXT;
    if (!embed && !target) return;
    leaving = true;
    clearTimers();
    paint();
    blink.classList.add("is-out");
    setTimeout(function () {
      if (embed) {
        window.parent.postMessage({ type: "slide:" + dir, from: "04-prompt" }, "*");
      } else {
        window.location.href = target;
      }
    }, reduce ? 0 : 620);
  }

  /* ---- ปุ่มควบคุม ---- */
  var controls = document.getElementById("controls");
  var btnAuto  = document.getElementById("btn-auto");
  controls.addEventListener("click", function (e) { e.stopPropagation(); });

  document.getElementById("btn-next").addEventListener("click", advance);
  document.getElementById("btn-prev").addEventListener("click", back);
  document.getElementById("btn-reset").addEventListener("click", reset);
  btnAuto.addEventListener("click", function () {
    auto = !auto;
    btnAuto.setAttribute("aria-pressed", auto ? "true" : "false");
    clearTimers();
    armAuto();
  });

  document.addEventListener("click", advance);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight" || e.key === "PageDown") {
      e.preventDefault(); advance();
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault(); back();
    } else if (e.key === "r" || e.key === "R") {
      reset();
    }
  });

  /* ============================================================
     ฉากล่าง — ลูปของตัวเอง ไม่ยุ่งกับ beat เลย
     ใช้ตัวจับเวลาคนละชุด (sceneT) จะได้ไม่โดน clearTimers() ของ beat ล้าง
     ============================================================ */
  /* ค่าแนวนอนชุดเดียวกับสไลด์ 3 — ทั้งฉาก (ตู้ rack→คน) กิน x 342..938
     กึ่งกลาง 640 = กลางเวทีพอดี ขยับค่าไหนต้องเลื่อนทั้งชุดพร้อมกัน */
  var BOT_HOME = 362;                      /* กลางตู้ rack — หุ่นเลื่อนเข้าไปหลังตู้ */
  var BOT_TALK = 816;                      /* จุดที่หุ่นมายืนคุยกับคน (ห่างจากคน 28px) */
  var GUY_X    = 891;                      /* คนยืนนิ่ง ขอบขวาสุดของฉาก = 938 */

  var bot    = document.getElementById("bot");
  var guy    = document.getElementById("guy");
  var botSay = document.getElementById("bot-say");
  var guySay = document.getElementById("guy-say");
  var rack   = document.getElementById("rack");

  /* บอลลูนหุ่นยังเป็นสัญลักษณ์โผล่ทั้งก้อนแบบสไลด์ 3 — ตัดกับฝั่งคนที่ต้องค่อยๆ พิมพ์ */
  var BOT_LINES  = ["0101", "\u266a", "\u25aa\u25aa\u25aa", "10\u25aa"];
  var CALL_LINES = ["\u25aa\u25aa", "?", "!", "\u25aa?"];
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  /* ---- โครงข้อความที่คนกำลังพิมพ์ — ย่อส่วนของฟองพรอมต์ข้างบน
     k: bar ย่อหน้า / bl บุลเล็ต / im รูปที่แนบ    w: ความกว้างของแท่ง
     ความกว้างต้องโตขึ้นเรื่อยๆ ไม่งั้นบอลลูนจะกว้างเต็มตั้งแต่บรรทัดแรกแล้วไม่ขยายอีก */
  var SK = [
    { k: "bar", w: 48 },
    { k: "bar", w: 66 },
    { k: "bl",  w: 66 },
    { k: "bl",  w: 73 },
    { k: "bl",  w: 81 },
    { k: "im",  w: 30 },
    { k: "bar", w: 104 }
  ];
  var SK_PADH = 14 + 6;                    /* padding ซ้ายขวา + เส้นขอบ */
  var SK_PADV = 10 + 6;
  var SK_GAP  = 3;

  var sceneT = [];
  function sat(ms, fn) { sceneT.push(setTimeout(fn, ms)); }

  function face(pawn, name) {
    var sp = pawn.querySelector(".sprite");
    if (sp.getAttribute("data-char") === name) return;
    sp.setAttribute("data-char", name);
    if (window.Characters) window.Characters.hydrate(pawn);
  }
  function say(el, text, emo) {
    el.classList.remove("is-sk");
    el.textContent = text;
    el.classList.toggle("is-emo", !!emo);
    el.classList.add("is-on");
  }
  function hush(el) { el.classList.remove("is-on"); }

  function move(x, ms) {
    bot.style.setProperty("--walk", ms + "ms");
    bot.offsetHeight;                      /* บังคับ reflow ให้ duration ใหม่มีผลก่อนย้าย */
    bot.style.setProperty("--x", x + "px");
  }

  /* ---- โหมดพิมพ์: เปิดกล่องเปล่าเล็กๆ ก่อน แล้วต่อบรรทัดทีละอัน ---- */
  var skBox = null;
  function skOpen() {
    guySay.classList.remove("is-emo");
    guySay.classList.add("is-sk");
    guySay.innerHTML = '<div class="sk"></div>';
    skBox = guySay.querySelector(".sk");
    guySay.style.setProperty("--sw", (20 + SK_PADH) + "px");
    guySay.style.setProperty("--sh", (4 + SK_PADV) + "px");
    guySay.classList.add("is-on");
  }
  function skLine(i) {
    var it = SK[i], row, bar;
    if (it.k === "bl") {
      row = document.createElement("div");
      row.className = "bl";
      row.innerHTML = '<span class="dot"></span><span class="bar"></span>';
      bar = row.querySelector(".bar");
    } else if (it.k === "im") {
      row = document.createElement("div");
      row.className = "im";
      bar = row;
    } else {
      row = document.createElement("span");
      row.className = "bar";
      bar = row;
    }
    skBox.appendChild(row);
    bar.offsetHeight;                      /* บังคับ reflow ก่อนสั่งความกว้าง ไม่งั้นไม่มี transition */
    bar.style.width = it.w + "px";

    var maxW = 0, sumH = 0;
    for (var j = 0; j <= i; j++) {
      var w = SK[j].w + (SK[j].k === "bl" ? 9 : 0);
      if (w > maxW) maxW = w;
      sumH += (SK[j].k === "im" ? 14 : 4);
    }
    guySay.style.setProperty("--sw", (maxW + SK_PADH) + "px");
    guySay.style.setProperty("--sh", (sumH + i * SK_GAP + SK_PADV) + "px");
  }

  function scene() {
    var t = 0;
    function step(ms, fn) { t += ms; sat(t, fn); }

    /* คนเรียก */
    step(600, function () { face(guy, "human-left"); say(guySay, pick(CALL_LINES)); });
    /* หุ่นออกจากตู้มาหา */
    step(800, function () {
      hush(guySay);
      bot.classList.remove("is-hidden");
      rack.classList.remove("is-busy");
      face(bot, "robot-right");
      move(BOT_TALK, 2100);
    });
    /* ถึงแล้ว คนเริ่มพิมพ์ — หุ่นยืนรอตลอดช่วงนี้ นี่คือจุดที่ต่างจากสไลด์ 3 */
    step(2300, skOpen);
    for (var i = 0; i < SK.length; i++) (function (n) {
      step(n === 0 ? 320 : 340, function () { skLine(n); });
    })(i);
    /* ส่งแล้ว หุ่นรับทราบ */
    step(900, function () { hush(guySay); });
    step(350, function () { say(botSay, "\u2713"); });
    step(700, function () { hush(botSay); });
    /* กลับเข้าตู้ไปทำงาน */
    step(250,  function () { face(bot, "robot-left"); face(guy, "human"); move(BOT_HOME, 2100); });
    step(2100, function () { bot.classList.add("is-hidden"); rack.classList.add("is-busy"); });
    /* ทำงานอยู่ในตู้สักพัก */
    step(2400, function () {
      bot.classList.remove("is-hidden");
      rack.classList.remove("is-busy");
      face(bot, "robot-right");
      face(guy, "human-left");
      move(BOT_TALK, 2100);
    });
    /* ออกมาตอบ ถูกตั้งแต่ครั้งแรก ไม่ต้องถามซ้ำ */
    step(2300, function () { say(botSay, pick(BOT_LINES)); });
    step(1400, function () { hush(botSay); });
    step(700,  function () { say(guySay, "\u2705", true); });
    step(1600, function () { hush(guySay); });
    /* กลับเข้าตู้ แล้ววนใหม่ */
    step(300,  function () { face(bot, "robot-left"); face(guy, "human"); move(BOT_HOME, 2100); });
    step(2100, function () { bot.classList.add("is-hidden"); rack.classList.add("is-busy"); });

    step(1400, scene);
  }

  guy.style.setProperty("--x", GUY_X + "px");
  bot.style.setProperty("--x", BOT_HOME + "px");

  if (reduce) {
    bot.style.setProperty("--x", BOT_TALK + "px");
    face(bot, "robot-right");
    face(guy, "human-left");
  } else {
    bot.classList.add("is-hidden");
    rack.classList.add("is-busy");
    sat(300, scene);
  }

  rebuild(0);
  paint();
  at(220, function () { setBeat(1); });
})();
</script>
</body>
</html>
